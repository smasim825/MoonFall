<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoonFall - Mission 1.1: Power and Energy</title>
  <meta name="description" content="Lunar base power station mission with Dr. Chiaki Mukai.">

  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/Jersey10.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Preload Core Images -->
  <link rel="preload" href="1.1_power_mission_assest/image 1.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_PointUp.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Idle.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Present.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/Neil_Armstrong_Idle.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/Objects/solarArray.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/Caption Text.webp" as="image">
  <link rel="preload" href="assets/power/Skip Button.webp" as="image">

  <link rel="stylesheet" href="style.css">

  <style>
    /* ==========================================================================
       MoonFall Mission 1.1: Power Station Engine Styles
       Exact replication of screenshots
       ========================================================================== */
    :root {
      --pixel-blue-border: #0099ff;
      --font-pixel: 'Jersey 10', monospace;
    }

    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-pixel);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    .power-game-viewport {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      /* Strict 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      background: #000000;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Scene Stage */
    .power-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Background Layer */
    .power-bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url('1.1_power_mission_assest/image 1.webp');
      background-size: cover;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: -webkit-optimize-contrast;
      z-index: 1;
    }

    /* Character: Dr. Chiaki Mukai (Left Side) */
    .character-chiaki {
      position: absolute;
      bottom: 0;
      left: 3.5%;
      width: 26%;
      height: 78%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      transition: opacity 0.35s ease;
    }

    .character-chiaki img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      object-position: bottom left;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75));
      image-rendering: pixelated;
    }

    /* Character: White Astronaut (Right Side) */
    .character-astronaut {
      position: absolute;
      bottom: 0;
      right: 3.5%;
      width: 27.5%;
      height: 76%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      transition: opacity 0.35s ease;
    }

    .character-astronaut img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75));
      image-rendering: pixelated;
    }

    /* Floating Educational Diagram Card (Right Quadrant) */
    .diagram-card-container {
      position: absolute;
      top: 6.5%;
      right: 5%;
      width: 48%;
      height: 59%;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: card-appear 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translateY(-10px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .diagram-card-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.8));
    }

    /* Dialogue Dock Footer */
    .power-dialogue-dock {
      position: absolute;
      bottom: 3.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      height: 19%;
      min-height: 90px;
      z-index: 25;
      pointer-events: auto;
      cursor: pointer;
    }

    .power-dialogue-frame {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(220, 235, 252, 0.93);
      border: 3.5px solid var(--pixel-blue-border);
      border-radius: 14px;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.65),
        inset 0 0 12px rgba(255, 255, 255, 0.6),
        0 0 15px rgba(0, 153, 255, 0.35);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-sizing: border-box;
    }

    /* Speaker Badge Image (Top Left) */
    .speaker-badge-box {
      position: absolute;
      top: -18.5%;
      left: 1.8%;
      height: 38%;
      z-index: 30;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .speaker-badge-box img {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
    }

    /* Skip Button (Top Right) */
    .skip-btn-box {
      position: absolute;
      top: -18.5%;
      right: 1.8%;
      height: 38%;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .skip-btn-box:hover {
      transform: scale(1.05);
      filter: brightness(1.08);
    }

    .skip-btn-box:active {
      transform: scale(0.96);
    }

    .skip-btn-box img {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
    }

    /* Dialogue Text */
    .dialogue-text-body {
      color: #000000;
      font-family: var(--font-pixel);
      font-size: clamp(1.15rem, 2.3vw, 2.25rem);
      line-height: 1.22;
      letter-spacing: 0.015em;
      margin: 0;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Top HUD / Controls */
    .top-hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-title-badge {
      background: rgba(0, 10, 30, 0.75);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 3px 14px;
      color: #ffffff;
      font-size: clamp(0.95rem, 1.6vw, 1.35rem);
      letter-spacing: 0.05em;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(0, 10, 30, 0.75);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 4px 14px;
      color: #7dd3fc;
      font-family: var(--font-pixel);
      font-size: clamp(0.95rem, 1.6vw, 1.35rem);
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s, color 0.2s;
    }

    .hud-btn:hover {
      background: #0284c7;
      color: #ffffff;
    }

    /* Mission Complete Modal */
    .mission-end-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 10, 25, 0.85);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: modal-in 0.35s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .end-modal-card {
      width: 55%;
      background: rgba(15, 23, 42, 0.95);
      border: 3px solid #38bdf8;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.4), 0 20px 40px rgba(0, 0, 0, 0.8);
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .end-modal-title {
      font-size: clamp(2rem, 4vw, 3.6rem);
      color: #38bdf8;
      margin: 0;
    }

    .end-modal-desc {
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      color: #e2e8f0;
      line-height: 1.3;
      margin: 0;
    }

    .end-modal-actions {
      display: flex;
      gap: 16px;
      margin-top: 10px;
    }

    .end-btn {
      padding: 8px 22px;
      border-radius: 8px;
      font-family: var(--font-pixel);
      font-size: clamp(1.1rem, 1.9vw, 1.7rem);
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, background 0.2s;
    }

    .end-btn-primary {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .end-btn-primary:hover {
      background: #0369a1;
      transform: scale(1.05);
    }

    .end-btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border-color: #475569;
    }

    .end-btn-secondary:hover {
      background: #334155;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Mobile Landscape Orientation Banner -->
  <aside class="orientation-banner" id="orientationBanner" role="dialog" aria-modal="true" aria-label="Rotate Device">
    <div class="orientation-card">
      <div class="phone-rotate-icon">📱 ➔ 🔄</div>
      <div class="orientation-title">Landscape View</div>
      <p class="orientation-desc">For the best mission experience, rotate your phone horizontally.</p>
      <div class="orientation-buttons">
        <button class="orientation-btn btn-rotate-now" onclick="toggleForceHorizontal()">
          ⤾ Rotate to Horizontal
        </button>
        <button class="orientation-btn btn-dismiss-rotate" onclick="dismissOrientationBanner()">
          Continue Vertical
        </button>
      </div>
    </div>
  </aside>

  <!-- Quick Floating Rotate Button on Mobile -->
  <button class="quick-rotate-toggle" id="quickRotateBtn" onclick="toggleForceHorizontal()" title="Toggle Horizontal Screen" aria-label="Toggle Horizontal Screen">
    🔄 Screen
  </button>

  <!-- Responsive 16:9 Game Viewport Wrapper -->
  <main class="power-game-viewport" id="gameViewport" role="application" aria-label="Mission 1.1 Power and Energy">

    <div class="power-stage" id="powerStage">

      <!-- Top HUD -->
      <header class="top-hud">

          <button class="hud-btn" id="soundBtn" onclick="toggleSound()">🔊 SOUND</button>

      <div class="power-bg-layer" id="powerBgLayer" aria-hidden="true"></div>

      <!-- Character Stage: Dr. Chiaki Mukai (Left) -->

      <div class="character-astronaut hidden" id="astronautStage">

      <!-- Floating Educational Diagram Card (Right Upper Quadrant) -->
      <div class="diagram-card-container hidden" id="diagramCardContainer">

      <!-- Dialogue Dock Footer -->
      <footer class="power-dialogue-dock hidden" id="dialogueDock" onclick="handleDialogueClick()">
        <div class="power-dialogue-frame">
          <!-- Speaker Badge Image -->
          <div class="speaker-badge-box" id="speakerBadgeBox">

          <!-- Yellow Skip Button -->
          <button class="skip-btn-box" id="skipButton" onclick="event.stopPropagation(); handleSkipClick()" title="Skip Dialogue">

      <!-- Mission Complete Modal -->
      <div class="mission-end-modal hidden" id="missionEndModal">
        <div class="end-modal-card">
          <div style="font-size: 2.8rem;">⚡🎉🏆</div>
          <h2 class="end-modal-title">MISSION 1.1 COMPLETE!</h2>
          <p class="end-modal-desc">
            You've explored the lunar power station components! Solar array, battery storage, day/night cycles, nuclear power, and the PDU.
          </p>
          <div class="end-modal-actions">
            <button class="end-btn end-btn-secondary" onclick="restartMission()">🔄 Replay</button>
            <button class="end-btn end-btn-primary" onclick="returnToBase()">🏠 Return to Base</button>
            <button class="end-btn end-btn-primary" onclick="goToRadiationMission()">🛡️ Mission 5.1 Radiation</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // =========================================================================
    // Web Audio Synthesizer
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }

      playTypewriter() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(740 + Math.random() * 120, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.028);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.028);
        } catch (e) { }
      }

      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) { }
      }

      playSuccess() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const startTime = this.ctx.currentTime + idx * 0.08;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.12, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.3);
          });
        } catch (e) { }
      }
    }

    const sound = new SoundEngine();

    function toggleSound() {
      sound.muted = !sound.muted;
      document.getElementById('soundBtn').textContent = sound.muted ? '🔇 MUTED' : '🔊 SOUND';
    }

    // =========================================================================
    // Scene Definitions (1 to 11) - Exact matches to user specifications
    // =========================================================================
    const SCENES = [
      // Scene 1: Just background, character comes in 2nd screen automatically
      {
        id: 1,
        autoAdvance: 1800,
        showChiaki: false,
        showAstronaut: false,
        cardImg: null,
        text: ""
      },
      // Scene 2: 2nd image given by user - Chiaki Mukai welcoming + Astronaut
      {
        id: 2,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp',
        showAstronaut: true,
        cardImg: null,
        text: "Welcome to the power station! Here you can find the equipment that generates, stores, and distributes electricity."
      },
      // Scene 3: solarArray img
      {
        id: 3,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_PointUp.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/solarArray.webp',
        text: "This is our Solar Array! Its photovoltaic cells convert sunlight into electrical energy nearby terrain."
      },
      // Scene 4: Solar Array img with text change
      {
        id: 4,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_PointUp.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/solarArray.webp',
        text: "NASA is developing tall, deployable solar arrays for the Moon’s south pole, where raising panels above the ground can help them receive sunlight over"
      },
      // Scene 5: batteryStorage img
      {
        id: 5,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Idle.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/BatteryStorageUnit.webp',
        text: "This is our Battery Storage Unit. It stores electrical energy so we can use it when the Solar Array cannot produce enough power."
      },
      // Scene 6: lunar_daynight-1 img
      {
        id: 6,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Present.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/LunarDaynightCycle-1.webp',
        text: "On much of the Moon, daylight lasts about 14 Earth days, followed by 14 days of darkness, making energy storage essential because..."
      },
      // Scene 7: lunar_daynight-2 img
      {
        id: 7,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_PointUp.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/LunarDaynightCycle-2.webp',
        text: "solar panels cannot generate electricity without sunlight and batteries have limited capacity, so we must manage our stored energy carefully"
      },
      // Scene 8: fission img
      {
        id: 8,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Present.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/Fission.webp',
        text: "NASA is developing nuclear-powered systems to provide electricity on the Moon. These systems could work even when sunlight is unavailable."
      },
      // Scene 9: nuclearF img
      {
        id: 9,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_PointUp.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/NuclearF.webp',
        text: "They would help power essential systems across the lunar outpost during long periods of darkness. However, no such reactor is currently operating on the Moon."
      },
      // Scene 10: PDU img
      {
        id: 10,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Present.webp',
        showAstronaut: false,
        cardImg: '1.1_power_mission_assest/Objects/PDU.webp',
        text: "Finally, This is our Power Distribution Unit. It directs electricity from available power sources to systems such as life support and scientific equipment."
      },
      // Scene 11: 5th image given by user - Chiaki Mukai waving + Astronaut, concluding text
      {
        id: 11,
        showChiaki: true,
        chiakiPose: '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp',
        showAstronaut: true,
        cardImg: null,
        text: "That was all for today. See you next at power distribution and Solar Restoration!! Best of Luck."
      }
    ];

    let currentSceneIdx = 0;
    let isTyping = false;
    let typeTimer = null;
    let autoAdvanceTimer = null;

    // DOM Elements
    const chiakiStage = document.getElementById('chiakiStage');
    const chiakiImg = document.getElementById('chiakiImg');
    const astronautStage = document.getElementById('astronautStage');
    const diagramCardContainer = document.getElementById('diagramCardContainer');
    const diagramCardImg = document.getElementById('diagramCardImg');
    const dialogueDock = document.getElementById('dialogueDock');
    const dialogueText = document.getElementById('dialogueText');
    const missionEndModal = document.getElementById('missionEndModal');

    function renderScene(idx) {
      if (idx >= SCENES.length) {
        showMissionComplete();
        return;
      }
      currentSceneIdx = idx;
      const s = SCENES[idx];

      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }

      // 1. Character: Chiaki Mukai
      if (s.showChiaki) {
        chiakiImg.src = s.chiakiPose || '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp';
        chiakiStage.classList.remove('hidden');
      } else {
        chiakiStage.classList.add('hidden');
      }

      // 2. Character: Astronaut
      if (s.showAstronaut) {
        astronautStage.classList.remove('hidden');
      } else {
        astronautStage.classList.add('hidden');
      }

      // 3. Diagram Card
      if (s.cardImg) {
        diagramCardImg.src = s.cardImg;
        diagramCardContainer.classList.remove('hidden');
      } else {
        diagramCardContainer.classList.add('hidden');
      }

      // 4. Dialogue Box
      if (s.text && s.text.length > 0) {
        dialogueDock.classList.remove('hidden');
        startTypewriter(s.text);
      } else {
        dialogueDock.classList.add('hidden');
      }

      // 5. Automatic transition (for Scene 1)
      if (s.autoAdvance) {
        autoAdvanceTimer = setTimeout(() => {
          renderScene(1);
        }, s.autoAdvance);
      }
    }

    function startTypewriter(str) {
      if (typeTimer) clearTimeout(typeTimer);
      isTyping = true;
      dialogueText.textContent = '';
      let charIndex = 0;

      function typeChar() {
        if (!isTyping) return;
        if (charIndex < str.length) {
          dialogueText.textContent += str.charAt(charIndex);
          if (charIndex % 3 === 0) sound.playTypewriter();
          charIndex++;
          typeTimer = setTimeout(typeChar, 18);
        } else {
          isTyping = false;
        }
      }
      typeChar();
    }

    function finishTypewriter() {
      if (!isTyping) return;
      isTyping = false;
      if (typeTimer) clearTimeout(typeTimer);
      dialogueText.textContent = SCENES[currentSceneIdx].text;
    }

    function handleDialogueClick() {
      if (isTyping) {
        finishTypewriter();
        return;
      }
      nextScene();
    }

    function handleSkipClick() {
      sound.playClick();
      if (isTyping) {
        finishTypewriter();
        return;
      }
      // If already at Scene 11, finish; otherwise jump to Scene 11 directly
      if (currentSceneIdx < SCENES.length - 1) {
        renderScene(SCENES.length - 1);
      } else {
        showMissionComplete();
      }
    }

    function nextScene() {
      sound.playClick();
      if (currentSceneIdx < SCENES.length - 1) {
        renderScene(currentSceneIdx + 1);
      } else {
        showMissionComplete();
      }
    }

    function showMissionComplete() {
      sound.playSuccess();
      missionEndModal.classList.remove('hidden');
    }

    function restartMission() {
      sound.playClick();
      missionEndModal.classList.add('hidden');
      renderScene(0);
    }

    function returnToBase() {
      sound.playClick();
      window.location.href = 'index.html';
    }

    function goToRadiationMission() {
      sound.playClick();
      window.location.href = '5.1_Radiation_mission.html';
    }

    // Keyboard navigation (Space / Enter / ArrowRight)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
        e.preventDefault();
        if (currentSceneIdx === 0) {
          renderScene(1);
        } else {
          handleDialogueClick();
        }
      }
    });

    // Orientation Controls
    function dismissOrientationBanner() {
      const banner = document.getElementById('orientationBanner');
      if (banner) banner.classList.add('hidden');
    }

    function toggleForceHorizontal() {
      const viewport = document.getElementById('gameViewport');
      viewport.classList.toggle('force-horizontal');
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      renderScene(0);
    });
  </script>
</body>

</html>
