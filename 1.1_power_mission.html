<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoonFall - Mission 1: Power and Energy</title>
  <meta name="description" content="Lunar base power station mission and system verification quiz.">

  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/Jersey10.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Preload Core Images -->
  <link rel="preload" href="1.1_power_mission_assest/image 1.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_PointUp.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Idle.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Present.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/Neil_Armstrong_Idle.webp" as="image">
  <link rel="preload" href="assets/power/Astronaut_Present.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/Pragyan_ShivShakti_Neutral.webp" as="image">
  <link rel="preload" href="assets/Mission Complete.png" as="image">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <script src="responsive.js" defer></script>

  <style>
    /* ==========================================================================
       MoonFall Mission 1: Power Station Engine Styles
       ========================================================================== */
    @font-face {
      font-family: 'Jersey 10';
      src: url('assets/fonts/Jersey10.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --pixel-blue-border: #0099ff;
      --pixel-yellow-btn: #fdcb0e;
      --font-pixel: 'Jersey 10', monospace;
    }

    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-pixel);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fullscreen Viewport Stage: Fills 100% width and height without black side bars */
    .power-game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000000;
      overflow: hidden;
    }

    /* Scene Stage */
    .power-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Background Layer */
    .power-bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url('1.1_power_mission_assest/image 1.webp');
      background-size: cover;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: -webkit-optimize-contrast;
      z-index: 1;
    }

    /* Character: Dr. Chiaki Mukai (Left Side - In Front of Dialogue Bar) */
    .character-chiaki {
      position: absolute;
      bottom: -2%;
      left: 2%;
      height: 52%;
      width: auto;
      pointer-events: none;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      transition: opacity 0.35s ease;
    }

    .character-chiaki img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom left;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75));
      image-rendering: pixelated;
    }

    /* Character: White Astronaut (Right Side - Under Dialogue Bar) */
    .character-astronaut {
      position: absolute;
      bottom: -2%;
      right: 4%;
      height: 52%;
      width: auto;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      transition: opacity 0.35s ease;
    }

    .character-astronaut img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75));
      image-rendering: pixelated;
    }

    /* Floating Educational Diagram Card (Centered in Middle) */
    .diagram-card-container {
      position: absolute;
      top: 5.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 58%;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: card-appear 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translate(-50%, -10px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .diagram-card-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.8));
    }

    /* Dialogue Dock Footer */
    .dialogue-wrapper {
      position: absolute;
      bottom: 4.8%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 25;
      padding: 0 3%;
      pointer-events: auto;
      cursor: pointer;
    }

    /* Chiaki Mukai Dialogue Box (scene-1-box: Rectangle 3.png) */
    .dialogue-box.scene-1-box {
      position: relative;
      width: 84%;
      max-width: 1360px;
      aspect-ratio: 2813 / 378;
      display: flex;
      align-items: center;
      padding: 0;
      box-sizing: border-box;
      margin-left: 7%;
      margin-right: 1.5%;
    }

    .scene-1-box .dialogue-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
    }

    .scene-1-box .speaker-badge {
      position: absolute;
      top: -16.5%;
      left: 17.5%;
      width: 17.5%;
      aspect-ratio: 479 / 127;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 35;
      pointer-events: none;
    }

    .speaker-badge-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .scene-1-box .skip-btn {
      position: absolute;
      top: -16.5%;
      right: 3.2%;
      width: 13.4%;
      aspect-ratio: 376 / 127;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 50;
      pointer-events: auto;
      padding: 0;
      outline: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .skip-btn * {
      pointer-events: none;
    }

    .skip-btn:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    .skip-btn:active {
      transform: scale(0.97);
    }

    .skip-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .skip-icon {
      position: absolute;
      left: 12.8%;
      top: 50%;
      transform: translateY(-50%);
      width: 26.3%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .scene-1-box .dialogue-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding-left: 18.5%;
      padding-right: 3%;
      padding-top: 14px;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .scene-1-box .dialogue-text {
      font-family: var(--font-pixel);
      font-size: clamp(1.25rem, 2.3vw, 2.5rem);
      font-weight: 400;
      line-height: 1.12;
      color: #000000;
      white-space: normal;
      word-break: normal;
      letter-spacing: 0.015em;
      text-shadow: none;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
      image-rendering: pixelated;
      margin: 0;
      width: 100%;
    }

    /* Astro Bee Dialogue Box (scene-2-box: Frame 6.png - Exact match to User Image & 5.1 Radiation Mission) */
    .dialogue-box.scene-2-box {
      position: relative;
      width: 81.4%;
      max-width: 1300px;
      aspect-ratio: 2610 / 248;
      display: flex;
      align-items: center;
      box-sizing: border-box;
    }

    .scene-2-box .dialogue-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.65));
    }

    .robot-avatar-container {
      position: absolute;
      left: 0.5%;
      top: 50%;
      transform: translateY(-50%);
      width: 14.5%;
      aspect-ratio: 374 / 386;
      z-index: 36;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: robot-hover 3s ease-in-out infinite alternate;
    }

    .robot-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7));
    }

    @keyframes robot-hover {
      0% {
        transform: translateY(-50%) rotate(0deg);
      }

      50% {
        transform: translateY(calc(-50% - 5px)) rotate(-0.5deg);
      }

      100% {
        transform: translateY(calc(-50% + 4px)) rotate(0.5deg);
      }
    }

    .scene-2-box .astro-bee-badge {
      position: absolute;
      top: -46%;
      left: 13.5%;
      width: 17.2%;
      aspect-ratio: 449 / 134;
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .astro-badge-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .scene-2-box .skip-btn {
      position: absolute;
      top: -26%;
      right: 2.8%;
      width: 14.4%;
      aspect-ratio: 376 / 127;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 50;
      pointer-events: auto;
      padding: 0;
      outline: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .scene-2-box .dialogue-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding-left: 18.5%;
      padding-right: 19%;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .scene-2-box .dialogue-text {
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 2.25vw, 2.45rem);
      font-weight: 400;
      line-height: 1.1;
      color: #fdcb0e !important;
      letter-spacing: 0.02em;
      white-space: normal;
      word-break: normal;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.9);
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
      image-rendering: pixelated;
      margin: 0;
      width: 100%;
    }

    /* ==========================================================================
       MCQ Quiz Box (Scenes 13 - 17)
       Replicating User Image 2 & 3
       ========================================================================== */
    .mcq-stage-box {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 76%;
      min-height: 36%;
      background: radial-gradient(circle at 50% 20%, rgba(5, 20, 48, 0.94) 0%, rgba(2, 10, 24, 0.97) 100%);
      border: 2.5px solid #00e5ff;
      border-radius: 12px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.85),
        inset 0 0 20px rgba(0, 229, 255, 0.15),
        0 0 25px rgba(0, 229, 255, 0.3);
      padding: 18px 26px;
      box-sizing: border-box;
      z-index: 25;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: mcq-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes mcq-pop {
      from {
        opacity: 0;
        transform: translate(-50%, -15px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    /* Robot Floating at Top Left of MCQ Box */
    .mcq-robot-avatar {
      position: absolute;
      top: -24px;
      left: -20px;
      width: 78px;
      height: 80px;
      z-index: 35;
      pointer-events: none;
    }

    .mcq-robot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
    }

    /* Speaker Pill attached next to robot */
    .mcq-speaker-pill {
      position: absolute;
      top: -18px;
      left: 64px;
      background: #ffffff;
      border: 2.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 1px 16px;
      color: #0284c7;
      font-size: clamp(1.1rem, 2vw, 1.85rem);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 30;
      line-height: 1.1;
    }

    /* MCQ Question Header */
    .mcq-question-title {
      color: #00e5ff;
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 2.35vw, 2.3rem);
      line-height: 1.25;
      letter-spacing: 0.02em;
      margin: 0 0 14px 62px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    /* Options List */
    .mcq-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-left: 62px;
    }

    .mcq-option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .mcq-option-item:hover:not(.locked) {
      background: rgba(0, 153, 255, 0.2);
      transform: translateX(4px);
    }

    .mcq-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ffffff;
      border-radius: 4px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .mcq-checkbox.checked {
      background: #0099ff;
      border-color: #0099ff;
      box-shadow: 0 0 10px #0099ff;
    }

    .mcq-checkbox.checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
    }

    .mcq-option-text {
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: clamp(1.15rem, 2.2vw, 2.15rem);
      line-height: 1.2;
      letter-spacing: 0.015em;
      transition: color 0.2s;
    }

    /* Feedback Colors */
    .mcq-option-item.state-correct .mcq-option-text {
      color: #00e676 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
    }

    .mcq-option-item.state-wrong .mcq-option-text {
      color: #ff3344 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(255, 51, 68, 0.6);
    }

    /* Top HUD / Controls */
    .top-hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-title-badge {
      background: rgba(0, 10, 30, 0.75);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 3px 14px;
      color: #ffffff;
      font-size: clamp(0.95rem, 1.6vw, 1.35rem);
      letter-spacing: 0.05em;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(0, 10, 30, 0.75);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 4px 14px;
      color: #7dd3fc;
      font-family: var(--font-pixel);
      font-size: clamp(0.95rem, 1.6vw, 1.35rem);
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s, color 0.2s;
    }

    .hud-btn:hover {
      background: #0284c7;
      color: #ffffff;
    }

    /* ==========================================================================
       Mission Complete Overlay (Matching 5.1 & User Image 4)
       ========================================================================== */
    .mission-complete-overlay {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translate(-50%, 0);
      width: 82%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: auto;
      animation: mission-pop-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes mission-pop-in {
      from {
        opacity: 0;
        transform: translate(-50%, -20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .mission-complete-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2vw;
    }

    .mission-complete-title {
      width: 76%;
      max-width: 820px;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.85));
    }

    /* Circular Verification Score Box (Circle Box) */
    .circle-score-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 6px 0;
    }

    .circle-score-box {
      position: relative;
      width: clamp(150px, 16.5vw, 215px);
      height: clamp(150px, 16.5vw, 215px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-circular-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.75));
    }

    .score-circle-bg {
      fill: rgba(2, 24, 55, 0.92);
      stroke: rgba(0, 153, 255, 0.22);
      stroke-width: 9.5;
    }

    .score-circle-progress {
      fill: none;
      stroke: #00e5ff;
      stroke-width: 9.5;
      stroke-linecap: round;
      stroke-dasharray: 314.16;
      stroke-dashoffset: 314.16;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease;
      filter: drop-shadow(0 0 14px rgba(0, 229, 255, 0.85));
    }

    .circle-score-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .circle-score-num {
      font-family: var(--font-pixel);
      font-size: clamp(2.5rem, 4.6vw, 4.8rem);
      font-weight: 400;
      color: #00e5ff;
      line-height: 1;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.85);
    }

    .circle-score-sub {
      font-family: var(--font-pixel);
      font-size: clamp(0.95rem, 1.45vw, 1.45rem);
      color: #94a3b8;
      letter-spacing: 0.12em;
      line-height: 1;
      margin-top: 4px;
    }

    .mission-complete-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5vw;
      width: 88%;
      margin-top: 4px;
    }

    .mission-btn {
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, filter 0.15s ease;
      outline: none;
    }

    .mission-btn img {
      height: clamp(34px, 5vw, 62px);
      width: auto;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6));
    }

    .mission-btn:hover {
      transform: translateY(-3px) scale(1.04);
      filter: brightness(1.15) drop-shadow(0 0 14px rgba(3, 143, 243, 0.7));
    }

    .mission-btn:active {
      transform: scale(0.96);
    }

    .hidden {
      display: none !important;
    }

    /* ==========================================================================
       Space Airlock Blast Doors Transition Overlay
       ========================================================================== */
    .space-airlock-overlay {
      display: none !important;
    }

    .space-airlock-overlay.opened {
      pointer-events: none !important;
      display: none !important;
    }

    .airlock-door {
      position: absolute;
      top: 0;
      width: 50.2vw;
      height: 100vh;
      background: linear-gradient(135deg, #070c18 0%, #152238 45%, #0a1122 100%);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
      transition: transform 0.65s cubic-bezier(0.2, 0.95, 0.25, 1);
      display: flex;
      align-items: center;
      overflow: hidden;
      will-change: transform;
    }

    .airlock-door-left {
      left: 0;
      transform: translateX(0);
      border-right: 3.5px solid #00e5ff;
      box-shadow: inset -10px 0 30px rgba(0, 229, 255, 0.25);
    }

    .airlock-door-right {
      right: 0;
      transform: translateX(0);
      border-left: 3.5px solid #00e5ff;
      box-shadow: inset 10px 0 30px rgba(0, 229, 255, 0.25);
    }

    /* Open Animations */
    .space-airlock-overlay.anim-open .airlock-door-left {
      transform: translateX(-101%);
    }

    .space-airlock-overlay.anim-open .airlock-door-right {
      transform: translateX(101%);
    }

    .space-airlock-overlay.anim-open .airlock-lock-hud {
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.3s ease, transform 0.35s ease;
    }

    // =========================================================================
    // Web Audio Synthesizer
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }

      playTypewriter() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(740 + Math.random() * 120, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.028);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.028);
        } catch (e) { }
      }

      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) { }
      }

      playCorrect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [660, 880, 1100].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.22);
          });
        } catch (e) { }
      }

      playWrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(160, now + 0.1);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } catch (e) { }
      }

      playSuccessFanfare() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const startTime = this.ctx.currentTime + idx * 0.085;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.14, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch (e) { }
      }
    }

    function renderScene(idx) {
      if (idx >= SCENES.length) {
        showMissionComplete();
        return;
      }
      currentSceneIdx = idx;
      const s = SCENES[idx];

      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }

      // Hide modals
      missionCompleteOverlay.classList.add('hidden');

      // 1. MCQ Handling
      if (s.isMcq) {
        chiakiStage.classList.add('hidden');
        diagramCardContainer.classList.add('hidden');
        dialogueWrapper.classList.add('hidden');

        // Astronaut pointing up (matches User Image 2 & 3)
        astronautImg.src = 'assets/power/Astronaut_Present.webp';
        astronautStage.classList.remove('hidden');

        // Render MCQ Box
        renderMcq(s);
        mcqBox.classList.remove('hidden');
        return;
      } else {
        mcqBox.classList.add('hidden');
      }

      // 2. Character: Chiaki Mukai
      if (s.showChiaki) {
        chiakiImg.src = s.chiakiPose || '1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp';
        chiakiStage.classList.remove('hidden');
      } else {
        chiakiStage.classList.add('hidden');
      }

      // 3. Character: Astronaut
      if (s.showAstronaut) {
        astronautImg.src = s.astronautPose || '1.1_power_mission_assest/Neil_Armstrong_Idle.webp';
        astronautStage.classList.remove('hidden');
      } else {
        astronautStage.classList.add('hidden');
      }

      // 4. Diagram Card
      if (s.cardImg) {
        diagramCardImg.src = s.cardImg;
        diagramCardContainer.classList.remove('hidden');
      } else {
        diagramCardContainer.classList.add('hidden');
      }

      // 5. Dialogue Box
      if (s.text && s.text.length > 0) {
        dialogueWrapper.classList.remove('hidden');

        // Astro Bee (Scene 12) vs Chiaki Mukai (Scenes 2-11)
        if (s.speaker === 'Astro Bee' || s.robotAvatar) {
          dialogueBoxChiaki.classList.add('hidden');
          dialogueBoxAstroBee.classList.remove('hidden');
          activeDialogueTextEl = dialogueTextAstroBee;
        } else {
          dialogueBoxChiaki.classList.remove('hidden');
          dialogueBoxAstroBee.classList.add('hidden');
          activeDialogueTextEl = dialogueTextChiaki;
        }

        startTypewriter(s.text);
      } else {
        dialogueWrapper.classList.add('hidden');
      }

      // 6. Automatic transition (for Scene 1)
      if (s.autoAdvance) {
        autoAdvanceTimer = setTimeout(() => {
          renderScene(1);
        }, s.autoAdvance);
      }
    }

    // =========================================================================
    // MCQ Logic
    // =========================================================================
    function renderMcq(mcq) {
      mcqAnswered = false;
      mcqQuestionTitle.textContent = mcq.question;
      mcqOptionsList.innerHTML = '';

      mcq.options.forEach((opt, optIdx) => {
        const item = document.createElement('div');
        item.className = 'mcq-option-item';
        item.dataset.index = optIdx;

        const check = document.createElement('div');
        check.className = 'mcq-checkbox';

        const text = document.createElement('span');
        text.className = 'mcq-option-text';
        text.textContent = opt.letter + '. ' + opt.text;

        item.appendChild(check);
        item.appendChild(text);

        item.addEventListener('click', () => {
          handleOptionSelect(optIdx, mcq.correctIndex);
        });

        mcqOptionsList.appendChild(item);
      });
    }

    function handleOptionSelect(chosenIdx, correctIdx) {
      if (mcqAnswered) return;
      mcqAnswered = true;

      const items = mcqOptionsList.querySelectorAll('.mcq-option-item');
      items.forEach(it => it.classList.add('locked'));

      const chosenItem = items[chosenIdx];
      const chosenCheck = chosenItem.querySelector('.mcq-checkbox');
      chosenCheck.classList.add('checked');

      if (chosenIdx === correctIdx) {
        // Correct Answer -> turns Green
        sound.playCorrect();
        correctAnswersCount++;
        chosenItem.classList.add('state-correct');
      } else {
        // Wrong Answer -> chosen turns Red, correct turns Green
        sound.playWrong();
        chosenItem.classList.add('state-wrong');
        const correctItem = items[correctIdx];
        if (correctItem) {
          correctItem.classList.add('state-correct');
        }
      }

      // Automatically advance to next question after 1.4s
      setTimeout(() => {
        nextScene();
      }, 1400);
    }

    // =========================================================================
    // Mission Complete Final Screen (Matching 5.1 & User Image 4)
    // =========================================================================
    function showMissionComplete() {
      sound.playSuccessFanfare();

      // Hide other overlays
      chiakiStage.classList.add('hidden');
      astronautStage.classList.add('hidden');
      diagramCardContainer.classList.add('hidden');
      mcqBox.classList.add('hidden');

      // Calculate Percentage (20% per correct answer)
      const percentage = Math.round((correctAnswersCount / 5) * 100);

      // Animate Circular Progress (Circumference = 2 * PI * 50 ≈ 314.16)
      const circleProgress = document.getElementById('scoreCircleProgress');
      const circleNum = document.getElementById('circleScoreNum');

      const offset = 314.16 * (1 - (percentage / 100));
      circleProgress.style.strokeDashoffset = offset;
      circleNum.textContent = percentage + '%';

      // Dynamically color ring and text based on score
      if (percentage >= 80) {
        circleProgress.style.stroke = '#22c55e';
        circleNum.style.color = '#22c55e';
        circleNum.style.textShadow = '0 0 14px rgba(34, 197, 94, 0.85)';
      } else if (percentage >= 40) {
        circleProgress.style.stroke = '#fdcb0e';
        circleNum.style.color = '#fdcb0e';
        circleNum.style.textShadow = '0 0 14px rgba(253, 203, 14, 0.85)';
      } else {
        circleProgress.style.stroke = '#ef4444';
        circleNum.style.color = '#ef4444';
        circleNum.style.textShadow = '0 0 14px rgba(239, 68, 68, 0.85)';
      }

      // Show Mission Complete Overlay
      missionCompleteOverlay.classList.remove('hidden');

      // Show bottom dialogue box with Astro Bee (scene-2-box matching reference image)
      dialogueWrapper.classList.remove('hidden');
      dialogueBoxChiaki.classList.add('hidden');
      dialogueBoxAstroBee.classList.remove('hidden');
      activeDialogueTextEl = dialogueTextAstroBee;

      const completeMsg = "Mission accomplished! Power station and habitat are safe and fully operational!";
      startTypewriter(completeMsg);
    }

    // =========================================================================
    // Typewriter Engine
    // =========================================================================
    let currentFullText = '';

    function startTypewriter(str) {
      currentFullText = str;
      if (typeTimer) clearTimeout(typeTimer);
      isTyping = true;
      if (activeDialogueTextEl) activeDialogueTextEl.textContent = '';
      let charIndex = 0;

      function typeChar() {
        if (!isTyping) return;
        if (charIndex < str.length) {
          if (activeDialogueTextEl) activeDialogueTextEl.textContent += str.charAt(charIndex);
          if (charIndex % 3 === 0) sound.playTypewriter();
          charIndex++;
          typeTimer = setTimeout(typeChar, 18);
        } else {
          isTyping = false;
        }
      }
      typeChar();
    }

    function finishTypewriter() {
      if (!isTyping) return;
      isTyping = false;
      if (typeTimer) clearTimeout(typeTimer);
      if (activeDialogueTextEl) activeDialogueTextEl.textContent = currentFullText;
    }

    function handleDialogueClick() {
      if (isTyping) {
        finishTypewriter();
        return;
      }
      nextScene();
    }

    function handleActionBtnClick() {
      sound.playClick();
      if (isTyping) {
        finishTypewriter();
        return;
      }
      // Step to next scene sequentially
      nextScene();
    }

    function nextScene() {
      sound.playClick();
      if (currentSceneIdx < SCENES.length - 1) {
        renderScene(currentSceneIdx + 1);
      } else {
        showMissionComplete();
      }
    }

    function restartMission() {
      sound.playClick();
      correctAnswersCount = 0;
      missionCompleteOverlay.classList.add('hidden');
      renderScene(0);
    }

    // =========================================================================
    // Space Airlock Transition Controller (Start & End of Mission)
    // =========================================================================
    class SpaceAirlockController {
      constructor() {
        this.overlay = document.getElementById('spaceAirlock');
        this.statusText = document.getElementById('airlockStatus');
        this.titleText = document.getElementById('airlockTitle');
        this.lampEl = document.getElementById('lockLamp');
        this.ribbonIcon = document.getElementById('ribbonIcon');
        this.boltPath = document.getElementById('lockBoltPath');
        this.cycleBtn = document.getElementById('airlockCycleBtn');
        this.steamVent = document.getElementById('steamLeft');
        this.audioCtx = null;
        this.hasOpened = false;
        this.isExiting = false;
      }

      initAudio() {
        try {
          if (typeof sound !== 'undefined' && sound.ctx) {
            this.audioCtx = sound.ctx;
          } else if (!this.audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) this.audioCtx = new AudioContextClass();
          }
          if (this.audioCtx && this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
          }
        } catch (e) {}
      }

      playPneumaticHiss() {
        try {
          this.initAudio();
          if (!this.audioCtx) return;
          const sampleRate = this.audioCtx.sampleRate;
          const duration = 0.65;
          const bufferSize = Math.floor(sampleRate * duration);
          const buffer = this.audioCtx.createBuffer(1, bufferSize, sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2800, this.audioCtx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(600, this.audioCtx.currentTime + duration);
          filter.Q.value = 2.8;

          const gain = this.audioCtx.createGain();
          gain.gain.setValueAtTime(0.48, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.audioCtx.destination);
          noise.start();
        } catch (e) {}
      }

      playLockThud() {
        try {
          this.initAudio();
          if (!this.audioCtx) return;
          const now = this.audioCtx.currentTime;

          // Deep hydraulic bass impact
          const sub = this.audioCtx.createOscillator();
          const subGain = this.audioCtx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(140, now);
          sub.frequency.exponentialRampToValueAtTime(28, now + 0.38);
          subGain.gain.setValueAtTime(0.7, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          sub.connect(subGain);
          subGain.connect(this.audioCtx.destination);
          sub.start(now);
          sub.stop(now + 0.38);

          // Metallic mechanical latch clack
          const clack = this.audioCtx.createOscillator();
          const clackGain = this.audioCtx.createGain();
          clack.type = 'square';
          clack.frequency.setValueAtTime(420, now);
          clack.frequency.exponentialRampToValueAtTime(95, now + 0.09);
          clackGain.gain.setValueAtTime(0.35, now);
          clackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          clack.connect(clackGain);
          clackGain.connect(this.audioCtx.destination);
          clack.start(now);
          clack.stop(now + 0.09);
        } catch (e) {}
      }

      playSealChime() {
        try {
          this.initAudio();
          if (!this.audioCtx) return;
          const now = this.audioCtx.currentTime;
          [784, 1046].forEach((freq, idx) => {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'sine';
            const startTime = now + idx * 0.09;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.22, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.25);
          });
        } catch (e) {}
      }

      executeOpen() {
        this.playPneumaticHiss();
        this.playLockThud();
        this.playSealChime();

        if (this.steamVent) this.steamVent.classList.add('active');
        if (this.lampEl) this.lampEl.classList.add('state-unlocked');
        if (this.ribbonIcon) this.ribbonIcon.textContent = '✔';
        if (this.boltPath) {
          this.boltPath.setAttribute('transform', 'rotate(45 50 50)');
          this.boltPath.setAttribute('stroke', '#00e676');
        }
        if (this.cycleBtn) this.cycleBtn.style.display = 'none';
        if (this.statusText) {
          this.statusText.textContent = 'SEAL DISENGAGED // ACCESS GRANTED';
          this.statusText.style.color = '#00e676';
        }

        setTimeout(() => {
          this.overlay.classList.add('anim-open');
          setTimeout(() => {
            this.overlay.classList.add('opened');
          }, 750);
        }, 280);
      }

      openOnStart() {
        if (!this.overlay) return;

        const triggerUnlock = () => {
          if (this.hasOpened) return;
          this.hasOpened = true;
          this.initAudio();
          this.executeOpen();
        };

        if (this.cycleBtn) {
          this.cycleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerUnlock();
          });
        }
        this.overlay.addEventListener('click', triggerUnlock);
        this.overlay.addEventListener('touchstart', triggerUnlock);

        // Auto-open after 2.4s if untouched
        setTimeout(() => {
          if (!this.hasOpened) {
            triggerUnlock();
          }
        }, 2400);
      }

      exit(targetUrl, statusMessage = 'RETURNING TO MAIN BASE...') {
        if (this.isExiting) return;
        this.isExiting = true;
        this.initAudio();

        this.overlay.classList.remove('opened');
        this.overlay.classList.remove('anim-open');

        if (this.lampEl) this.lampEl.classList.remove('state-unlocked');
        if (this.ribbonIcon) this.ribbonIcon.textContent = '🔒';
        if (this.boltPath) {
          this.boltPath.removeAttribute('transform');
          this.boltPath.setAttribute('stroke', '#fdcb0e');
        }
        if (this.cycleBtn) this.cycleBtn.style.display = 'none';
        if (this.statusText) {
          this.statusText.textContent = statusMessage;
          this.statusText.style.color = '#00e5ff';
        }

        // 1. Play loud airlock seal hiss immediately
        this.playPneumaticHiss();

        // 2. Play heavy hydraulic slam & lock chime when doors meet
        setTimeout(() => {
          this.playLockThud();
          this.playSealChime();
          if (this.statusText) {
            this.statusText.textContent = 'AIRLOCK SEALED // DECOMPRESSION COMPLETE';
            this.statusText.style.color = '#fdcb0e';
          }
          // 3. Allow audio to finish before navigating
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 450);
        }, 550);
      }
    }

      sound.playClick();

    window.addEventListener('DOMContentLoaded', () => {
      renderScene(0);
    });
