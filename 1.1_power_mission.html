<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoonFall - Mission 1.1: Power and Energy</title>
  <meta name="description" content="Lunar base power station mission and system verification quiz.">

  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/Jersey10.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Preload Core Images -->
  <link rel="preload" href="1.1_power_mission_assest/image 1.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_PointUp.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Idle.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Present.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/Neil_Armstrong_Idle.webp" as="image">
  <link rel="preload" href="assets/power/Astronaut_Present.webp" as="image">
  <link rel="preload" href="1.1_power_mission_assest/Pragyan_ShivShakti_Neutral.webp" as="image">
  <link rel="preload" href="assets/Mission Complete.png" as="image">

  <link rel="stylesheet" href="style.css">

  <style>
    /* ==========================================================================
       MoonFall Mission 1.1: Power Station Engine Styles
       ========================================================================== */
    :root {
      --pixel-blue-border: #0099ff;
      --pixel-yellow-btn: #fdcb0e;
      --font-pixel: 'Jersey 10', monospace;
    }

    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-pixel);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    .power-game-viewport {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      /* Strict 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      background: #000000;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Scene Stage */
    .power-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Background Layer */
    .power-bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url('1.1_power_mission_assest/image 1.webp');
      background-size: cover;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: -webkit-optimize-contrast;
      z-index: 1;
    }

    /* Character: Dr. Chiaki Mukai (Left Side - In Front of Dialogue Bar) */
    .character-chiaki {
      position: absolute;
      bottom: -2%;
      left: 2%;
      height: 52%;
      width: auto;
      pointer-events: none;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      transition: opacity 0.35s ease;
    }

    .character-chiaki img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom left;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75));
      image-rendering: pixelated;
    }

    /* Character: White Astronaut (Right Side - Under Dialogue Bar) */
    .character-astronaut {
      position: absolute;
      bottom: -2%;
      right: 4%;
      height: 52%;
      width: auto;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      transition: opacity 0.35s ease;
    }

    .character-astronaut img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75));
      image-rendering: pixelated;
    }

    /* Floating Educational Diagram Card (Centered in Middle) */
    .diagram-card-container {
      position: absolute;
      top: 5.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 58%;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: card-appear 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes card-appear {
      from {
        opacity: 0;
        transform: translate(-50%, -10px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .diagram-card-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.8));
    }

    /* Dialogue Dock Footer (Matching 5.1 Radiation Mission) */
    .dialogue-wrapper {
      position: absolute;
      bottom: 4.8%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 25;
      padding: 0 3%;
      pointer-events: auto;
      cursor: pointer;
    }

    .dialogue-box {
      position: relative;
      width: 87.7%;
      max-width: 1400px;
      aspect-ratio: 2813 / 378;
      display: flex;
      align-items: center;
      padding: 0 4.5%;
      box-sizing: border-box;
    }

    .dialogue-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
    }

    /* Speaker Badge (Shifted right so Chiaki Mukai in front doesn't overlap it) */
    .speaker-badge {
      position: absolute;
      top: -16.5%;
      left: 17.5%;
      width: 17.5%;
      aspect-ratio: 479 / 127;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 35;
      pointer-events: none;
    }

    .speaker-badge.astro-bee-badge {
      left: 14%;
      width: 17.2%;
      aspect-ratio: 449 / 134;
      top: -16.5%;
    }

    .speaker-badge-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      image-rendering: pixelated;
    }

    /* Skip Button (Top-right overlapping - matching 5.1 Radiation Mission) */
    .skip-btn {
      position: absolute;
      top: -16.5%;
      right: 3.2%;
      width: 13.4%;
      aspect-ratio: 376 / 127;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 50;
      pointer-events: auto;
      padding: 0;
      outline: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .skip-btn * {
      pointer-events: none;
    }

    .skip-btn:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    .skip-btn:active {
      transform: scale(0.97);
    }

    .skip-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .skip-icon {
      position: absolute;
      left: 12.8%;
      top: 50%;
      transform: translateY(-50%);
      width: 26.3%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      image-rendering: pixelated;
    }

    /* Floating Astro Bee Robot (for Scene 12 & Complete) */
    .robot-avatar-container {
      position: absolute;
      left: 0.5%;
      top: 50%;
      transform: translateY(-50%);
      width: 14.5%;
      aspect-ratio: 374 / 386;
      z-index: 36;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: robot-hover 3s ease-in-out infinite alternate;
    }

    .robot-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7));
    }

    @keyframes robot-hover {
      0% {
        transform: translateY(-50%) rotate(0deg);
      }

      50% {
        transform: translateY(calc(-50% - 5px)) rotate(-0.5deg);
      }

      100% {
        transform: translateY(calc(-50% + 4px)) rotate(0.5deg);
      }
    }

    /* Dialogue Text */
    .dialogue-content {
      position: relative;
      z-index: 2;
      width: 90%;
      padding-left: 17.5%;
      padding-right: 4%;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .dialogue-content.content-scene2 {
      padding-left: 15%;
      padding-right: 15%;
    }

    .dialogue-text {
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 2.25vw, 2.45rem);
      font-weight: 400;
      line-height: 1.12;
      color: #000000;
      white-space: normal;
      word-break: normal;
      letter-spacing: 0.02em;
      text-shadow: none;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
      image-rendering: pixelated;
      margin: 0;
    }

    .text-warning-yellow {
      color: #fdcb0e !important;
      text-shadow: 1px 1px 0 #000;
    }

    /* ==========================================================================
       MCQ Quiz Box (Scenes 13 - 17)
       Replicating User Image 2 & 3
       ========================================================================== */
    .mcq-stage-box {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 74%;
      min-height: 34%;
      background: rgba(2, 28, 62, 0.88);
      border: 3.5px solid var(--pixel-blue-border);
      border-radius: 14px;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.8),
        inset 0 0 16px rgba(0, 153, 255, 0.3),
        0 0 20px rgba(0, 153, 255, 0.4);
      padding: 16px 24px;
      box-sizing: border-box;
      z-index: 25;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: mcq-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes mcq-pop {
      from {
        opacity: 0;
        transform: translate(-50%, -15px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    /* Robot Floating at Top Left of MCQ Box */
    .mcq-robot-avatar {
      position: absolute;
      top: -24px;
      left: -20px;
      width: 78px;
      height: 80px;
      z-index: 35;
      pointer-events: none;
    }

    .mcq-robot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
    }

    /* Speaker Pill attached next to robot */
    .mcq-speaker-pill {
      position: absolute;
      top: -18px;
      left: 64px;
      background: #ffffff;
      border: 2.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 1px 16px;
      color: #0284c7;
      font-size: clamp(1.1rem, 2vw, 1.85rem);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 30;
      line-height: 1.1;
    }

    /* MCQ Question Header */
    .mcq-question-title {
      color: #00e5ff;
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 2.35vw, 2.3rem);
      line-height: 1.25;
      letter-spacing: 0.02em;
      margin: 0 0 14px 62px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    /* Options List */
    .mcq-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-left: 62px;
    }

    .mcq-option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .mcq-option-item:hover:not(.locked) {
      background: rgba(0, 153, 255, 0.2);
      transform: translateX(4px);
    }

    .mcq-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ffffff;
      border-radius: 4px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .mcq-checkbox.checked {
      background: #0099ff;
      border-color: #0099ff;
      box-shadow: 0 0 10px #0099ff;
    }

    .mcq-checkbox.checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
    }

    .mcq-option-text {
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: clamp(1.15rem, 2.2vw, 2.15rem);
      line-height: 1.2;
      letter-spacing: 0.015em;
      transition: color 0.2s;
    }

    /* Feedback Colors */
    .mcq-option-item.state-correct .mcq-option-text {
      color: #00e676 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
    }

    .mcq-option-item.state-wrong .mcq-option-text {
      color: #ff3344 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(255, 51, 68, 0.6);
    }

    /* Top HUD / Controls */
    .top-hud {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-title-badge {
      background: rgba(0, 10, 30, 0.75);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 3px 14px;
      color: #ffffff;
      font-size: clamp(0.95rem, 1.6vw, 1.35rem);
      letter-spacing: 0.05em;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(0, 10, 30, 0.75);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 4px 14px;
      color: #7dd3fc;
      font-family: var(--font-pixel);
      font-size: clamp(0.95rem, 1.6vw, 1.35rem);
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s, color 0.2s;
    }

    .hud-btn:hover {
      background: #0284c7;
      color: #ffffff;
    }

    /* ==========================================================================
       Mission Complete Overlay (Matching 5.1 & User Image 4)
       ========================================================================== */
    .mission-complete-overlay {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translate(-50%, 0);
      width: 82%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: auto;
      animation: mission-pop-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes mission-pop-in {
      from {
        opacity: 0;
        transform: translate(-50%, -20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .mission-complete-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2vw;
    }

    .mission-complete-title {
      width: 76%;
      max-width: 820px;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.85));
    }

    /* Circular Verification Score Box (Circle Box) */
    .circle-score-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 4px 0 2px 0;
    }

    .circle-score-box {
      position: relative;
      width: clamp(92px, 10vw, 122px);
      height: clamp(92px, 10vw, 122px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-circular-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.7));
    }

    .score-circle-bg {
      fill: rgba(2, 24, 55, 0.9);
      stroke: rgba(0, 153, 255, 0.22);
      stroke-width: 9;
    }

    .score-circle-progress {
      fill: none;
      stroke: #00e5ff;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 314.16;
      stroke-dashoffset: 314.16;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease;
      filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.75));
    }

    .circle-score-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .circle-score-num {
      font-family: var(--font-pixel);
      font-size: clamp(1.7rem, 3vw, 3rem);
      font-weight: 400;
      color: #00e5ff;
      line-height: 1;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.85);
    }

    .circle-score-sub {
      font-family: var(--font-pixel);
      font-size: clamp(0.7rem, 1.1vw, 1rem);
      color: #94a3b8;
      letter-spacing: 0.08em;
      line-height: 1;
      margin-top: 1px;
    }

    .circle-score-pill {
      background: rgba(2, 28, 62, 0.92);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 3px 18px;
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      letter-spacing: 0.04em;
      box-shadow: 0 0 15px rgba(0, 153, 255, 0.4);
    }

    .mission-complete-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5vw;
      width: 88%;
      margin-top: 4px;
    }

    .mission-btn {
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, filter 0.15s ease;
      outline: none;
    }

    .mission-btn img {
      height: clamp(34px, 5vw, 62px);
      width: auto;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6));
    }

    .mission-btn:hover {
      transform: translateY(-3px) scale(1.04);
      filter: brightness(1.15) drop-shadow(0 0 14px rgba(3, 143, 243, 0.7));
    }

    .mission-btn:active {
      transform: scale(0.96);
    }

    .hidden {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="astrobee/astrobee.css">
</head>

<body>
  <!-- Mobile Landscape Orientation Banner -->
  <aside class="orientation-banner" id="orientationBanner" role="dialog" aria-modal="true" aria-label="Rotate Device">
    <div class="orientation-card">
      <div class="phone-rotate-icon">📱 ➔ 🔄</div>
      <div class="orientation-title">Landscape View</div>
      <p class="orientation-desc">For the best mission experience, rotate your phone horizontally.</p>
      <div class="orientation-buttons">
        <button class="orientation-btn btn-rotate-now" onclick="toggleForceHorizontal()">
          ⤾ Rotate to Horizontal
        </button>
        <button class="orientation-btn btn-dismiss-rotate" onclick="dismissOrientationBanner()">
          Continue Vertical
        </button>
      </div>
    </div>
  </aside>

  <!-- Quick Floating Rotate Button on Mobile -->
  <button class="quick-rotate-toggle" id="quickRotateBtn" onclick="toggleForceHorizontal()"
    title="Toggle Horizontal Screen" aria-label="Toggle Horizontal Screen">
    🔄 Screen
  </button>

  <!-- Responsive 16:9 Game Viewport Wrapper -->
  <main class="power-game-viewport" id="gameViewport" role="application" aria-label="Mission 1.1 Power and Energy">

    <div class="power-stage" id="powerStage">

      <!-- Top HUD -->
      <header class="top-hud">
        <div class="hud-title-badge" id="hudTitle">⚡ MISSION 1.1: POWER STATION</div>
        <div style="display:flex; gap:8px;">
          <button class="hud-btn" id="soundBtn" onclick="toggleSound()">🔊 SOUND</button>
          <button class="hud-btn" onclick="returnToBase()">🏠 MAIN BASE</button>
        </div>
      </header>

      <!-- Background: Power Station Interior Room -->
      <div class="power-bg-layer" id="powerBgLayer" aria-hidden="true"></div>

      <!-- Character Stage: Dr. Chiaki Mukai (Left) -->
      <div class="character-chiaki hidden" id="chiakiStage">
        <img src="1.1_power_mission_assest/CharacterPoses/Chiaki_Mukai_Wave.webp" alt="Dr. Chiaki Mukai" id="chiakiImg">
      </div>

      <!-- Character Stage: White Astronaut (Right) -->
      <div class="character-astronaut hidden" id="astronautStage">
        <img src="1.1_power_mission_assest/Neil_Armstrong_Idle.webp" alt="Astronaut" id="astronautImg">
      </div>

      <!-- Floating Educational Diagram Card (Right Upper Quadrant) -->
      <div class="diagram-card-container hidden" id="diagramCardContainer">
        <img src="1.1_power_mission_assest/Objects/solarArray.webp" alt="Power System Diagram" id="diagramCardImg">
      </div>

      <!-- MCQ Quiz Stage Box (Scenes 13 - 17) -->
      <section class="mcq-stage-box hidden" id="mcqBox" aria-label="System Verification Question">
        <!-- Astro Bee Robot Avatar overlapping top-left -->
        <div class="mcq-robot-avatar">
          <img src="1.1_power_mission_assest/Pragyan_ShivShakti_Neutral.webp" alt="Astro Bee">
        </div>
        <!-- Speaker Pill -->
        <div class="mcq-speaker-pill">Astro Bee</div>

        <!-- Question Title -->
        <h3 class="mcq-question-title" id="mcqQuestionTitle">Q1. Which component generates electricity from sunlight?
        </h3>

        <!-- Options List -->
        <div class="mcq-options-list" id="mcqOptionsList">
          <!-- Dynamically populated options -->
        </div>
      </section>

      <!-- Mission Complete Overlay (Final Screen matching 5.1 & User Image 4) -->
      <div class="mission-complete-overlay hidden" id="missionCompleteOverlay">
        <div class="mission-complete-container">
          <img src="assets/Mission Complete.png" alt="Mission Complete" class="mission-complete-title">

          <!-- Circular Verification Score Box (Circle Box) -->

    // =========================================================================
    // Web Audio Synthesizer
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }

      playTypewriter() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(740 + Math.random() * 120, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.028);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.028);
        } catch (e) { }
      }

      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) { }
      }

      playCorrect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [660, 880, 1100].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.22);
          });
        } catch (e) { }
      }

      playWrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(160, now + 0.1);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } catch (e) { }
      }

      playSuccessFanfare() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const startTime = this.ctx.currentTime + idx * 0.085;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.14, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch (e) { }
      }
    }

    function renderMcq(mcq) {
      mcqAnswered = false;
      mcqQuestionTitle.textContent = mcq.question;
      mcqOptionsList.innerHTML = '';

      mcq.options.forEach((opt, optIdx) => {
        const item = document.createElement('div');
        item.className = 'mcq-option-item';
        item.dataset.index = optIdx;

        const check = document.createElement('div');
        check.className = 'mcq-checkbox';

        const text = document.createElement('span');
        text.className = 'mcq-option-text';
        text.textContent = opt.letter + '. ' + opt.text;

        item.appendChild(check);
        item.appendChild(text);

        item.addEventListener('click', () => {
          handleOptionSelect(optIdx, mcq.correctIndex);
        });

        mcqOptionsList.appendChild(item);
      });
    }

    function handleOptionSelect(chosenIdx, correctIdx) {
      if (mcqAnswered) return;
      mcqAnswered = true;

      const items = mcqOptionsList.querySelectorAll('.mcq-option-item');
      items.forEach(it => it.classList.add('locked'));

      const chosenItem = items[chosenIdx];
      const chosenCheck = chosenItem.querySelector('.mcq-checkbox');
      chosenCheck.classList.add('checked');

      if (chosenIdx === correctIdx) {
        // Correct Answer -> turns Green
        sound.playCorrect();
        correctAnswersCount++;
        chosenItem.classList.add('state-correct');
      } else {
        // Wrong Answer -> chosen turns Red, correct turns Green
        sound.playWrong();
        chosenItem.classList.add('state-wrong');
        const correctItem = items[correctIdx];
        if (correctItem) {
          correctItem.classList.add('state-correct');
        }
      }

      // Automatically advance to next question after 1.4s
      setTimeout(() => {
        nextScene();
      }, 1400);
    }

      // Calculate Percentage (20% per correct answer)
      const percentage = Math.round((correctAnswersCount / 5) * 100);

      // Animate Circular Progress (Circumference = 2 * PI * 50 ≈ 314.16)
      const circleProgress = document.getElementById('scoreCircleProgress');
      const circleNum = document.getElementById('circleScoreNum');
      const circlePill = document.getElementById('circleScorePill');

      const offset = 314.16 * (1 - (percentage / 100));
      circleProgress.style.strokeDashoffset = offset;
      circleNum.textContent = percentage + '%';

      // Dynamically color ring and text based on score
      if (percentage >= 80) {
        circleProgress.style.stroke = '#22c55e';
        circleNum.style.color = '#22c55e';
        circleNum.style.textShadow = '0 0 12px rgba(34, 197, 94, 0.85)';
      } else if (percentage >= 40) {
        circleProgress.style.stroke = '#fdcb0e';
        circleNum.style.color = '#fdcb0e';
        circleNum.style.textShadow = '0 0 12px rgba(253, 203, 14, 0.85)';
      } else {
        circleProgress.style.stroke = '#ef4444';
        circleNum.style.color = '#ef4444';
        circleNum.style.textShadow = '0 0 12px rgba(239, 68, 68, 0.85)';
      }

      circlePill.textContent = `VERIFICATION: ${correctAnswersCount} / 5 CORRECT (${percentage}%)`;

      // Show Mission Complete Overlay

    // =========================================================================
    // Typewriter Engine
    // =========================================================================
    let currentFullText = '';

    function startTypewriter(str) {
      currentFullText = str;
      if (typeTimer) clearTimeout(typeTimer);
      isTyping = true;
      dialogueText.textContent = '';
      let charIndex = 0;

      function typeChar() {
        if (!isTyping) return;
        if (charIndex < str.length) {
          dialogueText.textContent += str.charAt(charIndex);
          if (charIndex % 3 === 0) sound.playTypewriter();
          charIndex++;
          typeTimer = setTimeout(typeChar, 18);
        } else {
          isTyping = false;
        }
      }
      typeChar();
    }

    function finishTypewriter() {
      if (!isTyping) return;
      isTyping = false;
      if (typeTimer) clearTimeout(typeTimer);
      dialogueText.textContent = currentFullText;
    }

    function handleDialogueClick() {
      if (isTyping) {
        finishTypewriter();
        return;
      }
      nextScene();

      sound.playClick();
      if (isTyping) {
        finishTypewriter();
        return;
      }
      // Step to next scene sequentially
      nextScene();
    }

    function nextScene() {
      sound.playClick();
      if (currentSceneIdx < SCENES.length - 1) {
        renderScene(currentSceneIdx + 1);
      } else {
        showMissionComplete();
      }
    }

    function restartMission() {
      sound.playClick();
      correctAnswersCount = 0;
      missionCompleteOverlay.classList.add('hidden');
      renderScene(0);
    }

    function returnToBase() {
      sound.playClick();
      window.location.href = 'index.html';
    }

    function goToRadiationMission() {
      sound.playClick();
      window.location.href = '5.1_Radiation_mission.html';
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (currentSceneIdx === 0) {
          renderScene(1);
        } else if (!SCENES[currentSceneIdx]?.isMcq) {
          handleDialogueClick();
        }
      }
    });

    // Mobile Orientation
    function dismissOrientationBanner() {
      const banner = document.getElementById('orientationBanner');
      if (banner) banner.classList.add('hidden');
    }

    function toggleForceHorizontal() {
      const viewport = document.getElementById('gameViewport');
      viewport.classList.toggle('force-horizontal');
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      renderScene(0);
    });
  </script>
