  <style>
    /* ==========================================================================
       CSS Variables & Reset (Exact match to 1.1 Power & 5.1 Radiation missions)
       ========================================================================== */
    :root {
      --pixel-blue-border: #0099ff;
      --pixel-cyan: #00e5ff;
      --pixel-yellow: #fdcb0e;
      --pixel-green: #22c55e;
      --font-pixel: 'Jersey 10', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: var(--font-pixel);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .meal-game-viewport {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      /* Strict 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      background: #000000;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Scene Stage */
    .meal-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Background Layer */
    .meal-bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url('2.1_Daily_Meal/Group 1.webp');
      background-size: cover;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: -webkit-optimize-contrast;
      transition: background-image 0.4s ease, filter 0.4s ease;
      z-index: 1;
    }

    /* Dark Overlay for Scene 11 */
    .dark-backdrop-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.68);
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Character: Sunita Williams (Left Side - In Front of Dialogue Bar) */
    .character-sunita {
      position: absolute;
      bottom: -1%;
      left: 1.5%;
      height: 53%;
      width: auto;
      pointer-events: none;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      transition: opacity 0.3s ease;
    }

    .character-sunita img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom left;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
      image-rendering: pixelated;
    }

    /* Character: White Astronaut (Right Side - Under Dialogue Bar, Scene 1 Only) */
    .character-astronaut {
      position: absolute;
      bottom: -2%;
      right: 3.5%;
      height: 53%;
      width: auto;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .character-astronaut img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
      image-rendering: pixelated;
    }

    /* Educational / Diagram Card (Centered in Middle like Image 4 requirement) */
    .diagram-card-container {
      position: absolute;
      top: 5.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 58%;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, width 0.3s ease;
    }

    .diagram-card-container.card-wide {
      width: 54%;
      max-width: 800px;
    }

    .diagram-card-container.card-compact {
      width: 29%;
      max-width: 400px;
    }

    .diagram-card-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.85));
    }

    .card-prep-info {
      margin-top: 6px;
      background: rgba(2, 28, 62, 0.92);
      border: 1.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 3px 16px;
      color: #00e5ff;
      font-size: clamp(1.1rem, 1.8vw, 1.6rem);
      letter-spacing: 0.04em;
      box-shadow: 0 0 14px rgba(0, 153, 255, 0.5);
      animation: pop-in 0.3s ease;
    }

    /* ==========================================================================
       Scene 4: Meal Selection & Reserve HUD Widgets
       ========================================================================== */
    .scene4-container {
      position: absolute;
      top: 6%;
      left: 28%;
      right: 3%;
      height: 58%;
      z-index: 18;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2%;
      pointer-events: auto;
    }

    .meal-options-list {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      width: 58%;
      height: 100%;
    }

    .meal-option-card {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      border: 2px solid rgba(0, 153, 255, 0.35);
      border-radius: 8px;
      background: rgba(2, 24, 55, 0.85);
      cursor: pointer;
      overflow: hidden;
      padding: 3px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .meal-option-card:hover {
      border-color: #00e5ff;
      background: rgba(4, 45, 95, 0.95);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.7);
      transform: translateX(4px) scale(1.015);
    }

    .meal-option-card.selected {
      border-color: #fdcb0e;
      background: rgba(8, 55, 115, 0.98);
      box-shadow: 0 0 24px rgba(253, 203, 14, 0.85), inset 0 0 12px rgba(253, 203, 14, 0.3);
      transform: translateX(6px) scale(1.02);
    }

    .meal-option-card img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .selected-tag {
      position: absolute;
      top: 4px;
      right: 6px;
      background: #fdcb0e;
      color: #000000;
      font-size: clamp(0.9rem, 1.3vw, 1.25rem);
      font-weight: bold;
      padding: 1px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      box-shadow: 0 0 10px rgba(253, 203, 14, 0.8);
      display: none;
    }

    .meal-option-card.selected .selected-tag {
      display: block;
    }

    /* Reserve HUD Widgets */
    .reserve-hud-stack {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      width: 38%;
      height: 100%;
    }

    .reserve-box {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.7));
    }

    .reserve-box-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 1;
    }

    .reserve-track {
      position: absolute;
      left: 5%;
      top: 55%;
      width: 90%;
      height: 33%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      padding: 0 1.5%;
      box-sizing: border-box;
    }

    .reserve-slot {
      flex: 1;
      height: 88%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .reserve-slot img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      transition: opacity 0.25s ease, filter 0.25s ease, transform 0.2s ease;
    }

    .reserve-slot.active img {
      opacity: 1;
      filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.6));
    }

    .power-box .reserve-slot.active img {
      filter: drop-shadow(0 0 4px rgba(253, 203, 14, 0.6));
    }

    .reserve-slot.empty img {
      opacity: 0.12;
      filter: grayscale(100%) brightness(0.4);
    }

    .reserve-slot.preview-deduct img {
      opacity: 0.75;
      filter: drop-shadow(0 0 6px rgba(255, 51, 68, 0.9)) sepia(1) saturate(5) hue-rotate(-50deg);
      animation: slot-pulse 0.6s infinite alternate ease-in-out;
    }

    @keyframes slot-pulse {
      from {
        transform: scale(0.95);
        opacity: 0.45;
      }

      to {
        transform: scale(1.05);
        opacity: 0.95;
      }
    }

    /* ==========================================================================
       Scene 11: Daily Meal Intake Popup Modal
       ========================================================================== */
    .daily-intake-popup {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44%;
      max-width: 620px;
      aspect-ratio: 1182 / 589;
      z-index: 35;
      filter: drop-shadow(0 14px 40px rgba(0, 0, 0, 0.95));
      animation: popup-scale 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popup-scale {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .daily-intake-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 1;
    }

    .daily-intake-text-wrap {
      position: absolute;
      top: 17%;
      left: 38%;
      right: 5%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: none;
      z-index: 2;
    }

    .daily-intake-title {
      font-family: var(--font-pixel);
      font-size: clamp(1.6rem, 3.1vw, 3.4rem);
      font-weight: 400;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8);
    }

    .daily-intake-sub {
      font-family: var(--font-pixel);
      font-size: clamp(1.3rem, 2.5vw, 2.7rem);
      font-weight: 400;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: 0.05em;
      margin-top: 4px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8);
    }

    .daily-intake-slot1 {
      position: absolute;
      left: 5.4%;
      top: 64.5%;
      width: 28.9%;
      height: 21.6%;
      z-index: 3;
      overflow: hidden;
      border-radius: 4px;
    }

    .daily-intake-slot1 img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      transform-origin: left center;
      animation: intake-fill-up 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.85));
    }

    @keyframes intake-fill-up {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      100% {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    /* ==========================================================================
       MCQ Stage Box (Exact match to 1.1 Power & 5.1 Radiation missions)
       ========================================================================== */
    .mcq-stage-box {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 74%;
      min-height: 35%;
      background: rgba(2, 28, 62, 0.88);
      border: 3.5px solid var(--pixel-blue-border);
      border-radius: 14px;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.8),
        inset 0 0 16px rgba(0, 153, 255, 0.3),
        0 0 20px rgba(0, 153, 255, 0.4);
      padding: 18px 26px;
      box-sizing: border-box;
      z-index: 25;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: mcq-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes mcq-pop {
      from {
        opacity: 0;
        transform: translate(-50%, -15px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .mcq-robot-avatar {
      position: absolute;
      top: -24px;
      left: -20px;
      width: 78px;
      height: 80px;
      z-index: 35;
      pointer-events: none;
    }

    .mcq-robot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
    }

    .mcq-speaker-pill {
      position: absolute;
      top: -18px;
      left: 64px;
      background: #ffffff;
      border: 2.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 1px 16px;
      color: #0284c7;
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 2.1vw, 2rem);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 30;
      line-height: 1.1;
    }

    .mcq-question-title {
      color: #00e5ff;
      font-family: var(--font-pixel);
      font-size: clamp(1.35rem, 2.55vw, 2.5rem);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0.02em;
      margin: 0 0 14px 62px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    .mcq-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-left: 62px;
    }

    .mcq-option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .mcq-option-item:hover:not(.locked) {
      background: rgba(0, 153, 255, 0.2);
      transform: translateX(4px);
    }

    .mcq-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ffffff;
      border-radius: 4px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .mcq-checkbox.checked {
      background: #0099ff;
      border-color: #0099ff;
      box-shadow: 0 0 10px #0099ff;
    }

    .mcq-checkbox.checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
    }

    .mcq-option-text {
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: clamp(1.3rem, 2.4vw, 2.35rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.015em;
      transition: color 0.2s;
    }

    .mcq-option-item.state-correct .mcq-option-text {
      color: #00e676 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
    }

    .mcq-option-item.state-wrong .mcq-option-text {
      color: #ff3344 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(255, 51, 68, 0.6);
    }

    /* ==========================================================================
       Dialogue Dock Footer (Exact match to 1.1 Power Image 3 & 5.1 Radiation)
       ========================================================================== */
    .dialogue-wrapper {
      position: absolute;
      bottom: 4.8%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 25;
      padding: 0 3%;
      pointer-events: auto;
      cursor: pointer;
    }

    /* Scene 1-11 Sunita Box (using 2.1_Daily_Meal/Dialogue_Box.webp) */
    .dialogue-box.scene-1-box {
      position: relative;
      width: 87.7%;
      max-width: 1400px;
      aspect-ratio: 2824 / 441;
      display: flex;
      align-items: center;
      padding: 1.5% 4.5% 0 4.5%;
      box-sizing: border-box;
    }

    .scene-1-box .dialogue-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
    }

    /* Skip Button centered directly on the top blue line of the dialogue box */
    .scene-1-box .skip-btn {
      position: absolute;
      top: 15.9%;
      transform: translateY(-50%);
      right: 3.2%;
      width: 13.4%;
      aspect-ratio: 376 / 127;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 50;
      pointer-events: auto;
      padding: 0;
      outline: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .scene-1-box .skip-btn:hover {
      transform: translateY(-50%) scale(1.04);
      filter: brightness(1.08);
    }

    .scene-1-box .skip-btn:active {
      transform: translateY(-50%) scale(0.97);
    }

    .skip-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .skip-icon {
      position: absolute;
      left: 12.8%;
      top: 50%;
      transform: translateY(-50%);
      width: 26.3%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    .scene-1-box .dialogue-content {
      position: relative;
      z-index: 2;
      width: 90%;
      padding-left: 17.5%;
      padding-right: 4%;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .scene-1-box .dialogue-text {
      font-family: var(--font-pixel);
      font-size: clamp(1.25rem, 2.35vw, 2.5rem);
      font-weight: 400;
      line-height: 1.12;
      color: #000000;
      white-space: normal;
      word-break: normal;
      letter-spacing: 0.02em;
      text-shadow: none;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
      image-rendering: pixelated;
      margin: 0;

    /* Astro Bee Dialogue Box (Frame 6.png - for MCQ & Mission Complete) */
    .dialogue-box.scene-2-box {
      position: relative;
      width: 81.4%;
      max-width: 1300px;
      aspect-ratio: 2610 / 248;
      display: flex;
      align-items: center;
      box-sizing: border-box;
    }

    .scene-2-box .dialogue-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.65));
    }

    .robot-avatar-container {
      position: absolute;
      left: 0.5%;
      top: 50%;
      transform: translateY(-50%);
      width: 14.5%;
      aspect-ratio: 374 / 386;
      z-index: 36;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: robot-hover 3s ease-in-out infinite alternate;
    }

    .robot-avatar-img {

    // =========================================================================

    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTypewriter() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(540 + Math.random() * 80, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) { }
      }

      playDialogueAdvance() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.09);
        } catch (e) { }
      }

      playHoverTick() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(700, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.035);
        } catch (e) { }
      }

      playMealSelected() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.08, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.22);
          });
        } catch (e) { }
      }

      playIntakeFill() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [440, 554.37, 659.25, 880, 1108.7].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.06, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.07 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.25);
          });
        } catch (e) { }
      }

      playOptionSelect(isCorrect) {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          if (isCorrect) {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(783.99, now + 0.1);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.28);
          } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.1);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
          }
        } catch (e) { }
      }

      playSuccessFanfare() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const chord = [440, 554.37, 659.25, 880];
          chord.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.05, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.45);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.45);
          });
        } catch (e) { }
      }
    }

    // State Variables

    let activeDialogueTextEl = null;

    // DOM Elements
    const bgLayer = document.getElementById('bgLayer');

    // =========================================================================
    // Initialize Reserves HUD (10 Water Capsules & 10 Power Bars)
    // =========================================================================
    function initReserveTracks() {
      waterReserveTrack.innerHTML = '';
      powerReserveTrack.innerHTML = '';

      for (let i = 0; i < 10; i++) {
        const wSlot = document.createElement('div');
        wSlot.className = 'reserve-slot active';
        wSlot.id = `waterSlot_${i}`;
        const wImg = document.createElement('img');
        wImg.src = '2.1_Daily_Meal/Bar01.webp';
        wImg.alt = 'Water Capsule';
        wSlot.appendChild(wImg);
        waterReserveTrack.appendChild(wSlot);

        const pSlot = document.createElement('div');
        pSlot.className = 'reserve-slot active';
        pSlot.id = `powerSlot_${i}`;
        const pImg = document.createElement('img');
        pImg.src = '2.1_Daily_Meal/Yellow_bar04.webp';
        pImg.alt = 'Power Bar';
        pSlot.appendChild(pImg);
        powerReserveTrack.appendChild(pSlot);
      }
    }

    function updateReserveBars(previewMealId = null) {
      const activeMeal = previewMealId ? MEAL_DATA[previewMealId] : (selectedMealId ? MEAL_DATA[selectedMealId] : null);

      const waterDeduct = activeMeal ? activeMeal.waterBarsToDeduct : 0;
      const powerDeduct = activeMeal ? activeMeal.powerBarsToDeduct : 0;

      const isPreview = previewMealId !== null && previewMealId !== selectedMealId;

      const waterRemaining = 10 - waterDeduct;
      for (let i = 0; i < 10; i++) {
        const slot = document.getElementById(`waterSlot_${i}`);
        if (!slot) continue;
        slot.className = 'reserve-slot';

        if (i < waterRemaining) {
          slot.classList.add('active');
        } else {
          if (isPreview) {
            slot.classList.add('preview-deduct');
          } else {
            slot.classList.add('empty');
          }
        }
      }

      const powerRemaining = 10 - powerDeduct;
      for (let i = 0; i < 10; i++) {
        const slot = document.getElementById(`powerSlot_${i}`);
        if (!slot) continue;
        slot.className = 'reserve-slot';

        if (i < powerRemaining) {
          slot.classList.add('active');
        } else {
          if (isPreview) {
            slot.classList.add('preview-deduct');
          } else {
            slot.classList.add('empty');
          }
        }
      }
    }

    // =========================================================================
    // Meal Selection & Hover Handlers
    // =========================================================================
    function previewMeal(mealId) {
      if (currentSceneIndex !== 3) return;
      hoveredMealId = mealId;
      sound.playHoverTick();
      updateReserveBars(mealId);
    }

    function unpreviewMeal(mealId) {
      if (currentSceneIndex !== 3) return;
      hoveredMealId = null;
      updateReserveBars(null);
    }

    function selectMeal(mealId) {
      if (currentSceneIndex !== 3) return;
      selectedMealId = mealId;
      sound.playMealSelected();

      [1, 2, 3].forEach(id => {
        const card = document.getElementById(`mealCard${id}`);
        if (card) {
          if (id === mealId) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
        }
      });

      updateReserveBars(null);

      const meal = MEAL_DATA[mealId];
      const proceedText = `${meal.title} selected! Reserves updated: -${meal.waterReq} Water, -${meal.powerReq} Power. Click SKIP to proceed!`;
      startTypewriter(proceedText);
    }

    // =========================================================================
    // Scene Progression Engine
    // =========================================================================
    function renderScene(idx) {
      if (idx >= SCENES.length) {
        startMcqFlow();
        return;
      }

      const s = SCENES[idx];

      // Update Background
      if (s.bg) {
        bgLayer.style.backgroundImage = `url('${s.bg}')`;
      }

      // Dark Overlay
      if (s.isDark) {
        darkBackdropOverlay.classList.remove('hidden');
      } else {
        darkBackdropOverlay.classList.add('hidden');
      }

      // Update Character Poses
      if (s.pose) {
        sunitaImg.src = s.pose;
        sunitaStage.classList.remove('hidden');
      } else {
        sunitaStage.classList.add('hidden');
      }

      // Astronaut thumbs up (Scene 1 only)
      if (s.astronaut) {
        astronautStage.classList.remove('hidden');
      } else {
        astronautStage.classList.add('hidden');
      }

      // Educational / Diagram Cards (Centered)
      if (s.diagramCard) {
        diagramCardContainer.classList.remove('hidden');
        diagramCardImg.src = s.diagramCard;

        diagramCardContainer.classList.remove('card-wide', 'card-compact');
        if (s.cardType === 'wide') {
          diagramCardContainer.classList.add('card-wide');
        } else if (s.cardType === 'compact') {
          diagramCardContainer.classList.add('card-compact');
        }

        if (s.sceneId === 5) {
          cardPrepInfo.classList.remove('hidden');
          const chosen = selectedMealId ? MEAL_DATA[selectedMealId].title : "Meal 1 — Balanced";
          cardPrepInfo.textContent = `${chosen} Sealed & Ready`;
        } else {
          cardPrepInfo.classList.add('hidden');
        }
      } else {
        diagramCardContainer.classList.add('hidden');
      }

      // Scene 4 Interactive Meal Selection
      if (s.showScene4) {
        scene4Container.classList.remove('hidden');
        updateReserveBars(null);
      } else {
        scene4Container.classList.add('hidden');
      }

      // Scene 11: Daily Intake Popup Modal
      if (s.showDiningIntake) {
        dailyIntakePopup.classList.remove('hidden');
        const chosenKcal = selectedMealId ? MEAL_DATA[selectedMealId].kcal : 850;
        dailyIntakeKcal.textContent = `${chosenKcal} KCAL/ 3035KCAL`;

        dailyIntakeSlot1.innerHTML = '<img src="2.1_Daily_Meal/image 43.webp" alt="Intake Portion Filled">';
        sound.playIntakeFill();
      } else {
        dailyIntakePopup.classList.add('hidden');
      }

      // Hide MCQ Box & Mission Complete during story
      mcqBox.classList.add('hidden');
      missionCompleteOverlay.classList.add('hidden');
      dialogueWrapper.classList.remove('hidden');

      // Switch Dialogue Box Style (Sunita vs Astro Bee)
      if (s.isAstroBee) {
        dialogueBoxSunita.classList.add('hidden');
        dialogueBoxAstroBee.classList.remove('hidden');
        activeDialogueTextEl = dialogueTextAstroBee;
      } else {
        dialogueBoxSunita.classList.remove('hidden');
        dialogueBoxAstroBee.classList.add('hidden');
        activeDialogueTextEl = dialogueTextSunita;
      }

      // Typewriter Dialogue
      let dialogueMsg = s.text;
      if (s.sceneId === 11) {
        const chosenKcal = selectedMealId ? MEAL_DATA[selectedMealId].kcal : 850;
        dialogueMsg = `${chosenKcal} kcal consumed for this meal! Daily intake logged. Click SKIP to continue to verification!`;
      }
      startTypewriter(dialogueMsg);
    }

    function advanceScene() {
      sound.playDialogueAdvance();

      // If in MCQ mode, handle by option clicks
      if (currentMcqIndex >= 0) return;

      // If on Scene 4 and no meal chosen, default choose Meal 1
      if (currentSceneIndex === 3 && !selectedMealId) {
        selectMeal(1);
        setTimeout(() => {
          currentSceneIndex++;
          renderScene(currentSceneIndex);
        }, 300);
        return;
      }

      currentSceneIndex++;
      renderScene(currentSceneIndex);
    }

    function handleDialogueClick() {
      if (isTyping) {
        completeTypewriter();
      } else {
        if (currentMcqIndex === -1) {
          advanceScene();
        }
      }
    }

    function handleActionBtnClick() {
      if (isTyping) {
        completeTypewriter();
      } else {
        if (currentMcqIndex === -1) {
          advanceScene();
        }
      }
    }

    // =========================================================================
    // MCQ Verification Flow (5 Questions)
    // =========================================================================
    function startMcqFlow() {
      currentMcqIndex = 0;
      correctAnswersCount = 0;

      // Hide story stages
      sunitaStage.classList.add('hidden');
      astronautStage.classList.add('hidden');
      diagramCardContainer.classList.add('hidden');
      scene4Container.classList.add('hidden');
      dailyIntakePopup.classList.add('hidden');
      darkBackdropOverlay.classList.add('hidden');
      dialogueWrapper.classList.add('hidden');

      // Reset background to base food room
      bgLayer.style.backgroundImage = "url('2.1_Daily_Meal/Group 1.webp')";

      renderMcqQuestion();
    }

    function renderMcqQuestion() {
      if (currentMcqIndex >= MCQ_QUESTIONS.length) {
        showMissionComplete();
        return;
      }

      const q = MCQ_QUESTIONS[currentMcqIndex];

      mcqQuestionTitle.textContent = q.question;
      mcqOptionsList.innerHTML = '';
      mcqBox.classList.remove('hidden');

      q.options.forEach((opt) => {
        const item = document.createElement('div');
        item.className = 'mcq-option-item';
        item.setAttribute('data-key', opt.key);

        const checkbox = document.createElement('div');
        checkbox.className = 'mcq-checkbox';

        const text = document.createElement('span');
        text.className = 'mcq-option-text';
        text.textContent = `${opt.key}) ${opt.text}`;

        item.appendChild(checkbox);
        item.appendChild(text);

        item.onclick = () => handleOptionClick(opt.key, item);
        mcqOptionsList.appendChild(item);
      });
    }

    function handleOptionClick(selectedKey, selectedItemEl) {
      const q = MCQ_QUESTIONS[currentMcqIndex];
      const isCorrect = selectedKey === q.correct;

      // Lock options
      const allItems = mcqOptionsList.querySelectorAll('.mcq-option-item');
      allItems.forEach(el => el.classList.add('locked'));

      // Checkbox checked
      const cb = selectedItemEl.querySelector('.mcq-checkbox');
      if (cb) cb.classList.add('checked');

      if (isCorrect) {
        selectedItemEl.classList.add('state-correct');
        sound.playOptionSelect(true);
        correctAnswersCount++;
      } else {
        selectedItemEl.classList.add('state-wrong');
        sound.playOptionSelect(false);

        // Highlight correct option
        allItems.forEach(el => {
          if (el.getAttribute('data-key') === q.correct) {
            el.classList.add('state-correct');
          }
        });
      }

      // Next question delay
      setTimeout(() => {
        currentMcqIndex++;
        renderMcqQuestion();
      }, 950);
    }

    // =========================================================================
    // Typewriter Engine
    // =========================================================================
    function startTypewriter(str) {
      currentFullText = str;
      if (typeTimer) clearTimeout(typeTimer);
      isTyping = true;
      if (activeDialogueTextEl) activeDialogueTextEl.textContent = '';
      let charIndex = 0;

      function typeChar() {
        if (!isTyping) return;
        if (charIndex < str.length) {
          if (activeDialogueTextEl) activeDialogueTextEl.textContent += str.charAt(charIndex);
          if (charIndex % 3 === 0) sound.playTypewriter();
          charIndex++;
          typeTimer = setTimeout(typeChar, 18);
        } else {
          isTyping = false;
        }
      }

      typeChar();
    }

    function completeTypewriter() {
      if (!isTyping) return;
      if (typeTimer) clearTimeout(typeTimer);
      isTyping = false;
      if (activeDialogueTextEl) activeDialogueTextEl.textContent = currentFullText;
    }

    // =========================================================================
    // Mission Complete Final Screen (Score calculated from 5 MCQs)
    // =========================================================================
    function showMissionComplete() {
      sound.playSuccessFanfare();

      // Hide all game elements
      sunitaStage.classList.add('hidden');
      astronautStage.classList.add('hidden');
      diagramCardContainer.classList.add('hidden');
      scene4Container.classList.add('hidden');
      dailyIntakePopup.classList.add('hidden');
      darkBackdropOverlay.classList.add('hidden');
      mcqBox.classList.add('hidden');

      // Calculate percentage score based on 5 MCQs (20% per correct answer)
      const percentage = Math.round((correctAnswersCount / 5) * 100);

      const circleProgress = document.getElementById('scoreCircleProgress');
      const circleNum = document.getElementById('circleScoreNum');

      const offset = 314.16 * (1 - (percentage / 100));
      circleProgress.style.strokeDashoffset = offset;
      circleNum.textContent = percentage + '%';

      if (percentage >= 80) {
        circleProgress.style.stroke = '#22c55e';
        circleNum.style.color = '#22c55e';
        circleNum.style.textShadow = '0 0 14px rgba(34, 197, 94, 0.85)';
      } else if (percentage >= 40) {
        circleProgress.style.stroke = '#fdcb0e';
        circleNum.style.color = '#fdcb0e';
        circleNum.style.textShadow = '0 0 14px rgba(253, 203, 14, 0.85)';
      } else {
        circleProgress.style.stroke = '#ef4444';
        circleNum.style.color = '#ef4444';
        circleNum.style.textShadow = '0 0 14px rgba(239, 68, 68, 0.85)';
      }

      // Show Mission Complete Overlay
      missionCompleteOverlay.classList.remove('hidden');

      // Bottom dialogue with Astro Bee (scene-2-box matching reference image)
      dialogueWrapper.classList.remove('hidden');
      dialogueBoxSunita.classList.add('hidden');
      dialogueBoxAstroBee.classList.remove('hidden');
      activeDialogueTextEl = dialogueTextAstroBee;

      const completeMsg = "Mission accomplished! Outstanding work, Cadet! Our crew and lunar habitat are well nourished and ready for operations.";
      startTypewriter(completeMsg);
    }

    function restartMission() {
      selectedMealId = 1;
      hoveredMealId = null;
      currentMcqIndex = -1;
      correctAnswersCount = 0;
      [1, 2, 3].forEach(id => {
        const card = document.getElementById(`mealCard${id}`);
        if (card) {
          if (id === 1) card.classList.add('selected');
          else card.classList.remove('selected');
        }
      });
      initReserveTracks();
      currentSceneIndex = 0;
      renderScene(0);
    }

    function returnToBase() {
      window.location.href = 'index.html';
    }

    function goToNextMission() {
      window.location.href = '5.1_Radiation_mission.html';
    }

    // Keyboard Shortcuts (Space / Enter to Advance)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        handleDialogueClick();
      }
    });

    // Initialize on Load
    window.addEventListener('DOMContentLoaded', () => {
      initReserveTracks();
      renderScene(0);
    });
  </script>
