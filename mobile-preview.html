<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonFall - iOS Safari Live Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #080c14;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Control Bar */
    header {
      width: 100%;
      background: #0d1527;
      border-bottom: 1px solid #1e293b;
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
      letter-spacing: 0.02em;
    }

    .brand-apple {
      font-size: 1.3rem;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    select:hover, button:hover {
      background: #334155;
      border-color: #38bdf8;
    }

    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      width: 100%;
    }

    /* =========================================================================
       iPhone Chassis Mockup
       ========================================================================= */
    .iphone-case {
      position: relative;
      background: #1c1c1e;
      border: 4px solid #3a3a3c;
      outline: 2px solid #1c1c1e;
      border-radius: 54px;
      box-shadow:
        0 0 0 2px #0a0a0c,
        0 25px 65px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Screen Inner Bezel */
    .iphone-screen {
      position: relative;
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =========================================================================
       iOS Status Bar (Top)
       ========================================================================= */
    .ios-status-bar {
      height: 44px;
      background: #000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      z-index: 50;
      flex-shrink: 0;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 80px;
    }

    /* Dynamic Island */
    .dynamic-island {
      width: 110px;
      height: 28px;
      background: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      transition: all 0.25s ease;
    }

    .di-camera {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0a0a14;
      border: 1px solid #1e1e2d;
    }

    .di-sensor {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #0f172a;
    }

    .status-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      width: 80px;
    }

    /* Cellular Signal SVG */
    .signal-icon, .wifi-icon, .battery-icon {
      display: inline-block;
      vertical-align: middle;
    }

    /* Battery Pill */
    .battery-pill {
      display: inline-flex;
      align-items: center;
      border: 1.5px solid #ffffff;
      border-radius: 4px;
      padding: 1px;
      width: 22px;
      height: 11.5px;
      position: relative;
    }

    .battery-pill::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 3px;
      width: 1.5px;
      height: 4px;
      background: #ffffff;
      border-radius: 0 1px 1px 0;
    }

    .battery-fill {
      width: 80%;
      height: 100%;
      background: #ffffff;
      border-radius: 1.5px;
    }

    /* =========================================================================
       Main Iframe Content Container
       ========================================================================= */
    .screen-body {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .safari-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* =========================================================================
       Safari Address Bar & Bottom Toolbar (Portrait Mode)
       ========================================================================= */
    .safari-bottom-bar {
      background: rgba(22, 22, 24, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 0.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 50;
      transition: all 0.25s ease;
    }

    /* Floating URL Pill */
    .safari-address-box {
      margin: 8px 16px 4px 16px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #ffffff;
      font-size: 13.5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .safari-address-box:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .url-left {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      font-size: 12px;
    }

    .url-center {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #f1f5f9;
    }

    .url-lock {
      font-size: 11px;
      opacity: 0.8;
    }

    .url-reload-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.15s, transform 0.2s;
    }

    .url-reload-btn:hover {
      color: #38bdf8;
      transform: rotate(45deg);
    }

    /* Safari Action Toolbar (Back, Forward, Share, Bookmarks, Tabs) */
    .safari-nav-toolbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      color: #007aff;
    }

    .safari-tool-icon {
      background: none;
      border: none;
      color: #007aff;
      font-size: 18px;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .safari-tool-icon:hover {
      background: rgba(0, 122, 255, 0.15);
    }

    .safari-tool-icon.disabled {
      color: rgba(255, 255, 255, 0.25);
      cursor: default;
    }

    .safari-tool-icon.disabled:hover {
      background: none;
    }

    /* Home Indicator Line */
    .home-indicator-bar {
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
    }

    .home-indicator-pill {
      width: 135px;
      height: 4.5px;
      background: #ffffff;
      border-radius: 10px;
      opacity: 0.75;
    }

    /* =========================================================================
       LANDSCAPE MODE STYLES (Real iOS Safari Landscape Behavior)
       ========================================================================= */
    .iphone-case.landscape {
      border-radius: 46px;
    }

    .iphone-case.landscape .ios-status-bar {
      height: 28px;
      padding: 0 20px;
      font-size: 11.5px;
    }

    .iphone-case.landscape .dynamic-island {
      width: 80px;
      height: 20px;
    }

    /* In Safari Landscape, bottom bar turns into a thin compact bottom toolbar or top floating pill */
    .iphone-case.landscape .safari-bottom-bar {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      padding: 0 16px;
    }

    .iphone-case.landscape .safari-address-box {
      margin: 0;
      height: 28px;
      font-size: 12px;
      flex: 1;
      max-width: 320px;
      margin: 0 auto;
    }

    .iphone-case.landscape .safari-nav-toolbar {
      height: 38px;
      gap: 4px;
    }

    .iphone-case.landscape .safari-tool-icon {
      font-size: 14px;
      padding: 4px 8px;
    }

    .iphone-case.landscape .home-indicator-bar {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 8px;
      pointer-events: none;
      z-index: 60;
    }

    .iphone-case.landscape .home-indicator-pill {
      width: 110px;
      height: 3.5px;
    }

    /* Hide Safari Chrome Toggle */
    .iphone-case.hide-safari-chrome .safari-bottom-bar,
    .iphone-case.hide-safari-chrome .ios-status-bar {
      display: none !important;
    }

    .info-footer {
      font-size: 0.8rem;
      color: #64748b;
      padding: 10px 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Controller Bar -->
  <header>
    <div class="brand">
      <span class="brand-apple"></span>
      <span>Safari Mobile Live Inspector</span>
    </div>

    <div class="controls">
      <label style="font-size: 0.85rem; color: #94a3b8;">Device:</label>
      <select id="deviceSelect" onchange="applyDevice()">
        <option value="852x393" selected>iPhone 15 Pro / 16 (852 × 393)</option>
        <option value="932x430">iPhone 15 / 16 Pro Max (932 × 430)</option>
        <option value="844x390">iPhone 14 / 13 / 12 (844 × 390)</option>
        <option value="812x375">iPhone 13 mini / X (812 × 375)</option>
        <option value="667x375">iPhone SE / 8 (667 × 375)</option>
      </select>

      <button id="btnLandscape" class="active" onclick="setOrientation('landscape')">🔄 Landscape</button>
      <button id="btnPortrait" onclick="setOrientation('portrait')">📱 Portrait</button>
      <button id="btnToggleChrome" onclick="toggleSafariChrome()">👁️ Safari Bars: ON</button>
      <button onclick="reloadFrame()" title="Reload Game">⟳ Reload</button>
    </div>
  </header>

  <!-- Interactive iPhone Chassis -->
  <div class="preview-container">
    <div class="iphone-case landscape" id="iphoneCase" style="width: 852px; height: 393px;">
      <div class="iphone-screen">
        
        <!-- iOS Status Bar -->
        <div class="ios-status-bar" id="iosStatusBar">
          <div class="status-left">
            <span id="liveTime">9:41</span>
          </div>

          <div class="dynamic-island">
            <div class="di-camera"></div>
            <div class="di-sensor"></div>
          </div>

          <div class="status-right">
            <!-- Cellular Signal SVG -->
            <svg class="signal-icon" width="16" height="12" viewBox="0 0 17 12" fill="white">
              <rect x="0" y="9" width="3" height="3" rx="0.5"/>
              <rect x="4.5" y="6" width="3" height="6" rx="0.5"/>
              <rect x="9" y="3" width="3" height="9" rx="0.5"/>
              <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
            </svg>

            <!-- Wi-Fi SVG -->
            <svg class="wifi-icon" width="15" height="12" viewBox="0 0 16 12" fill="white">
              <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-4.24-2.83a6 6 0 018.48 0l-1.41 1.41a4 4 0 00-5.66 0L3.76 6.67zm-2.83-2.83a10 10 0 0114.14 0l-1.41 1.41a8 8 0 00-11.32 0L.93 3.84z"/>
            </svg>

            <!-- Battery Pill -->
            <div class="battery-pill">
              <div class="battery-fill"></div>
            </div>
          </div>
        </div>

        <!-- Webpage Viewport -->
        <div class="screen-body">
          <iframe class="safari-frame" id="safariFrame" src="/index.html"></iframe>
        </div>

        <!-- Safari Bottom Bar (URL Box & Action Toolbar) -->
        <div class="safari-bottom-bar" id="safariBottomBar">
          <div class="safari-address-box" onclick="reloadFrame()" title="Click to reload">
            <div class="url-left">
              <span>aA</span>
            </div>
            <div class="url-center">
              <span class="url-lock">🔒</span>
              <span id="urlText">moonfall-blush.vercel.app</span>
            </div>
            <button class="url-reload-btn" onclick="event.stopPropagation(); reloadFrame();" title="Reload page">
              ↻
            </button>
          </div>

          <!-- Bottom Safari Controls (Back, Forward, Share, Tabs) -->
          <div class="safari-nav-toolbar" id="safariNavToolbar">
            <button class="safari-tool-icon disabled" title="Back">‹</button>
            <button class="safari-tool-icon disabled" title="Forward">›</button>
            <button class="safari-tool-icon" title="Share" onclick="alert('Share URL: ' + window.location.origin)">⎋</button>
            <button class="safari-tool-icon" title="Bookmarks">📖</button>
            <button class="safari-tool-icon" title="Tabs">⧉</button>
          </div>

          <!-- iOS Home Indicator Bar -->
          <div class="home-indicator-bar">
            <div class="home-indicator-pill"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="info-footer">
    💡 Exactly mirrors an iPhone running Safari with genuine top notch/island, safe areas, address bar, and live clock.
  </div>

  <script>
    let currentOrientation = 'landscape';
    let safariChromeVisible = true;

    // Live Clock in iOS Status Bar
    function updateLiveClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('liveTime').textContent = hours + ':' + minutes;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function getSelectedDimensions() {
      const val = document.getElementById('deviceSelect').value;
      const [w, h] = val.split('x').map(Number);
      return { w, h };
    }

    function applyDevice() {
      const { w, h } = getSelectedDimensions();
      const phone = document.getElementById('iphoneCase');
      if (currentOrientation === 'landscape') {
        phone.style.width = Math.max(w, h) + 'px';
        phone.style.height = Math.min(w, h) + 'px';
        phone.classList.add('landscape');
      } else {
        phone.style.width = Math.min(w, h) + 'px';
        phone.style.height = Math.max(w, h) + 'px';
        phone.classList.remove('landscape');
      }
    }

    function setOrientation(mode) {
      currentOrientation = mode;
      document.getElementById('btnLandscape').classList.toggle('active', mode === 'landscape');
      document.getElementById('btnPortrait').classList.toggle('active', mode === 'portrait');
      applyDevice();
    }

    function toggleSafariChrome() {
      safariChromeVisible = !safariChromeVisible;
      const phone = document.getElementById('iphoneCase');
      phone.classList.toggle('hide-safari-chrome', !safariChromeVisible);
      document.getElementById('btnToggleChrome').textContent = safariChromeVisible ? '👁️ Safari Bars: ON' : '👁️ Safari Bars: OFF';
    }

    function reloadFrame() {
      const frame = document.getElementById('safariFrame');
      frame.src = frame.src.split('?')[0] + '?t=' + Date.now();
    }

    applyDevice();
  </script>
</body>
</html>
