  <style>
    /* ==========================================================================
       CSS Variables & Reset (Exact match to 2.1 Daily Meal & 1.1 Power missions)
       ========================================================================== */
    @font-face {
      font-family: 'Jersey 10';
      src: url('assets/fonts/Jersey10.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --pixel-blue-border: #0099ff;
      --pixel-cyan: #00e5ff;
      --pixel-yellow: #fdcb0e;
      --pixel-green: #22c55e;
      --font-pixel: 'Jersey 10', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: var(--font-pixel);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .game-viewport {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      /* Strict 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      background: #000000;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Scene Stage */
    .game-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Background Layer */
    .bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url('2.2_Hydroponics/Group 1.webp');
      background-size: cover;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: -webkit-optimize-contrast;
      transition: background-image 0.4s ease, filter 0.4s ease;
      z-index: 1;
    }

    /* Dark Overlay for Transitions & Timelapse */
    .dark-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.72);
      z-index: 22;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .dark-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Characters: Sunita Williams (Left Side) */
    .character-sunita {
      position: absolute;
      bottom: -1%;
      left: 1.5%;
      height: 53%;
      width: auto;
      pointer-events: none;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .character-sunita img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom left;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
      image-rendering: pixelated;
    }

    /* Character: White Astronaut (Right Side) */
    .character-astronaut {
      position: absolute;
      bottom: -2%;
      right: 3.5%;
      height: 53%;
      width: auto;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .character-astronaut img {
      height: 100%;
      width: auto;
      max-height: 100%;
      max-width: none;
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
      image-rendering: pixelated;
    }

    /* ==========================================================================
       Airlock Back-View Characters (Scenes 4 & 5 - image 129 & 130)
       ========================================================================== */
    .airlock-characters-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 12;
      transition: opacity 0.3s ease;
    }

    .airlock-sunita-back {
      position: absolute;
      bottom: -1%;
      left: 11%;
      height: 59%;
      width: auto;
      display: flex;
      align-items: flex-end;
    }

    .airlock-sunita-back img {
      height: 100%;
      width: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
    }

    .airlock-astronaut-back {
      position: absolute;
      bottom: -1%;
      right: 7%;
      height: 60%;
      width: auto;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .airlock-astronaut-back img {
      height: 100%;
      width: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8));
    }

    /* ==========================================================================
       Scenes 6 & 7: Toxic Regolith Surface Overlays (R.png & tOXIC_cOMPONENTS.webp)
       ========================================================================== */
    .toxic-surface-overlays {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.3s ease;
    }

    .hazard-skull-badge {
      position: absolute;
      top: 6.5%;
      left: 6%;
      width: 9.5%;
      max-width: 130px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hazard-skull-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 16px rgba(255, 0, 0, 0.6));
    }

    .toxic-components-panel {
      position: absolute;
      top: 11%;
      right: 17%;
      height: 57%;
      width: auto;
      aspect-ratio: 644 / 1145;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toxic-components-panel img {
      height: 100%;
      width: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.85));
    }

    /* ==========================================================================
       Scene 2: Regolith + Hydroponics Card (Frame 13.png)
       ========================================================================== */
    .regolith-card-container {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      width: 54%;
      max-width: 860px;
      aspect-ratio: 1855 / 802;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: pop-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .regolith-card-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.85));
    }

    /* ==========================================================================
       Scene 10: Interactive Red START Button with Dark Focus Backdrop
       ========================================================================== */
    .start-button-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.88) 45%, rgba(0, 0, 0, 0.96) 100%);
      z-index: 28;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
    }

    .retro-start-btn {
      background: linear-gradient(180deg, #ff4d5a 0%, #d81c2b 50%, #8c0c16 100%);
      border: 3.5px solid #222b35;
      outline: 3px solid #ff4d5a;
      border-radius: 8px;
      padding: 14px 44px;
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: clamp(2.2rem, 4.2vw, 4.2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.85),
        0 0 32px rgba(255, 45, 60, 0.9),
        inset 0 3px 6px rgba(255, 255, 255, 0.4),
        inset 0 -4px 8px rgba(0, 0, 0, 0.6);
      text-shadow: 2px 2px 0 #500000;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: start-pulse 1.8s infinite ease-in-out;
    }

    .retro-start-btn:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.9),
        0 0 38px rgba(255, 45, 60, 1),
        inset 0 3px 8px rgba(255, 255, 255, 0.6);
    }

    .retro-start-btn:active {
      transform: scale(0.96);
      filter: brightness(0.95);
    }

    @keyframes start-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    /* ==========================================================================
       Scene 11: Animated Timelapse Overlay
       ========================================================================== */
    .timelapse-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0, 20, 45, 0.85) 0%, rgba(0, 0, 0, 0.95) 100%);
      z-index: 28;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .timelapse-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .timelapse-title {
      font-family: var(--font-pixel);
      font-size: clamp(1.8rem, 3.4vw, 3.6rem);
      color: #00e5ff;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
      margin-bottom: 12px;
      animation: pulse-glow 1s infinite alternate;
    }

    .timelapse-day-counter {
      font-family: var(--font-pixel);
      font-size: clamp(3.2rem, 7.5vw, 7.8rem);
      color: #fdcb0e;
      letter-spacing: 0.05em;
      text-shadow: 0 0 30px rgba(253, 203, 14, 0.9), 3px 3px 0 #000;
    }

    .timelapse-progress-bar {
      width: 44%;
      height: 14px;
      background: rgba(2, 28, 62, 0.85);
      border: 2px solid var(--pixel-blue-border);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 20px;
      box-shadow: 0 0 16px rgba(0, 153, 255, 0.5);
    }

    .timelapse-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #fdcb0e);
      transition: width 0.1s linear;
    }

    /* ==========================================================================
       HUD Badges: "X Days Passed" & "Earth Grown"
       ========================================================================== */
    .hud-days-badge {
      position: absolute;
      top: 3.2%;
      right: clamp(75px, 8.5vw, 105px);
      background: rgba(18, 25, 34, 0.94);
      border: 2px solid #5a6e82;
      border-radius: 6px;
      padding: 4px 16px;
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      letter-spacing: 0.05em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75);
      z-index: 15;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hud-callout-earth {
      position: absolute;
      top: 18%;
      left: 11%;
      transform: translateX(-50%);
      z-index: 18;
      pointer-events: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      animation: earth-float 2.4s ease-in-out infinite alternate;
    }

    @keyframes earth-float {
      0% {
        transform: translate(-50%, 0);
      }
      100% {
        transform: translate(-50%, -7px);
      }
    }

    .callout-bubble {
      position: relative;
      background: #ffffff;
      border: 2.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 3px 14px;
      color: #0284c7;
      font-family: var(--font-pixel);
      font-size: clamp(1.15rem, 1.9vw, 1.75rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 153, 255, 0.35);
      white-space: nowrap;
    }

    .callout-pointer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -2px;
      filter: drop-shadow(0 2px 8px rgba(0, 229, 255, 0.6));
    }

    .callout-pointer-svg {
      width: 24px;
      height: clamp(80px, 12.5vh, 125px);
      display: block;
      overflow: visible;
    }

    .pointer-arrowhead {
      animation: arrow-bounce 1.2s ease-in-out infinite alternate;
      transform-origin: 12px 84px;
    }

    @keyframes arrow-bounce {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(5px);
      }
    }

    /* ==========================================================================
       MCQ Quiz Stage Box (Scenes 13, 15, 17, 20)
       Exact match to previous missions (Mission 2.1 & 1.1) and user reference
       ========================================================================== */
    .mcq-stage-box {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      max-width: 1200px;
      min-height: 32%;
      background: rgba(2, 28, 62, 0.88);
      border: 3.5px solid var(--pixel-blue-border);
      border-radius: 14px;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.8),
        inset 0 0 16px rgba(0, 153, 255, 0.3),
        0 0 20px rgba(0, 153, 255, 0.4);
      padding: 16px 24px;
      box-sizing: border-box;
      z-index: 30;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: mcq-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      cursor: default;
    }

    @keyframes mcq-pop {
      from {
        opacity: 0;
        transform: translate(-50%, -15px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    /* Robot Floating at Top Left of MCQ Box */
    .mcq-robot-avatar {
      position: absolute;
      top: -24px;
      left: -20px;
      width: 78px;
      height: 80px;
      z-index: 35;
      pointer-events: none;
    }

    .mcq-robot-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
    }

    /* Speaker Pill attached next to robot */
    .mcq-speaker-pill {
      position: absolute;
      top: -18px;
      left: 64px;
      background: #ffffff;
      border: 2.5px solid var(--pixel-blue-border);
      border-radius: 6px;
      padding: 1px 16px;
      color: #0284c7;
      font-family: var(--font-pixel);
      font-size: clamp(1.1rem, 2vw, 1.85rem);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      z-index: 30;
      line-height: 1.1;
      white-space: nowrap;
    }

    /* MCQ Question Header - Bright Cyan */
    .mcq-question-title {
      color: #00e5ff;
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 2.35vw, 2.3rem);
      line-height: 1.25;
      letter-spacing: 0.02em;
      margin: 0 0 14px 62px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    /* Options List */
    .mcq-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-left: 62px;
      width: calc(100% - 62px);
    }

    .mcq-option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      width: fit-content;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .mcq-option-item:hover:not(.locked) {
      background: rgba(0, 153, 255, 0.2);
      transform: translateX(4px);
    }

    .mcq-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ffffff;
      border-radius: 4px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .mcq-checkbox.checked {
      background: #0099ff;
      border-color: #0099ff;
      box-shadow: 0 0 10px #0099ff;
    }

    .mcq-checkbox.checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
    }

    .mcq-option-text {
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: clamp(1.15rem, 2.2vw, 2.15rem);
      line-height: 1.2;
      letter-spacing: 0.015em;
      transition: color 0.2s;
    }

    /* Feedback Colors */
    .mcq-option-item.state-correct {
      background: rgba(0, 230, 118, 0.2) !important;
      border-color: rgba(0, 230, 118, 0.5) !important;
    }

    .mcq-option-item.state-correct .mcq-option-text {
      color: #00e676 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
    }

    .mcq-option-item.state-correct .mcq-checkbox {
      background: #00e676;
      border-color: #00e676;
      box-shadow: 0 0 10px #00e676;
    }

    .mcq-option-item.state-wrong {
      background: rgba(255, 51, 68, 0.2) !important;
      border-color: rgba(255, 51, 68, 0.5) !important;
      animation: option-shake 0.4s ease;
    }

    .mcq-option-item.state-wrong .mcq-option-text {
      color: #ff3344 !important;
      font-weight: bold;
      text-shadow: 0 0 12px rgba(255, 51, 68, 0.6);
    }

    @keyframes option-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* ==========================================================================
       Dialogue Dock Footer (Exact match to 2.1 Daily Meal & 1.1 Power Image 3)
       ========================================================================== */
    .dialogue-wrapper {
      position: absolute;
      bottom: 4.8%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 25;
      padding: 0 3%;
      pointer-events: auto;
      cursor: pointer;
    }

    /* Sunita Box (using 2.1_Daily_Meal/Dialogue_Box.webp) */
    .dialogue-box.scene-1-box {
      position: relative;
      width: 85%;
      max-width: 1380px;
      aspect-ratio: 2824 / 441;
      display: flex;
      box-sizing: border-box;
      margin-left: 7.5%;
      margin-right: 1.5%;
    }

    .scene-1-box .dialogue-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
    }

    /* Skip Button centered directly on the top blue line of the dialogue box */
    .scene-1-box .skip-btn {
      position: absolute;
      top: 15.9%;
      transform: translateY(-50%);
      right: 2.5%;
      width: 12.2%;
      aspect-ratio: 376 / 127;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 50;
      pointer-events: auto;
      padding: 0;
      outline: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .scene-1-box .skip-btn:hover {
      transform: translateY(-50%) scale(1.04);
      filter: brightness(1.08);
    }

    .scene-1-box .skip-btn:active {
      transform: translateY(-50%) scale(0.97);
    }

    .skip-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;

  <script>
    /* ==========================================================================
       Sound Synthesizer (Web Audio API - Offline & Instant)
       ========================================================================== */
    class AudioSynthesizer {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTypewriterClick() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(540 + Math.random() * 80, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) { }
      }

      playDialogueAdvance() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.09);
        } catch (e) { }
      }

      playCorrect() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.08, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.25);
          });
        } catch (e) { }
      }

      playWrong() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.3);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch (e) { }
      }

      playTimelapseTick() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800 + Math.random() * 200, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) { }
      }

      playFanfare() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [
            { f: 523.25, d: 0.14 },
            { f: 659.25, d: 0.14 },
            { f: 783.99, d: 0.14 },
            { f: 1046.5, d: 0.45 }
          ];
          let time = now;
          notes.forEach(n => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, time);
            gain.gain.setValueAtTime(0.12, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + n.d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + n.d);
            time += n.d * 0.85;
          });
        } catch (e) { }
      }

    /* ==========================================================================
       State Management
       ========================================================================== */
    let currentSceneIndex = 0;

    let correctAnswersCount = 0;

    /* ==========================================================================
       Typewriter Effect with Dynamic Auto-Fitting
       ========================================================================== */
    function startTypewriter(text) {
      if (typewriterTimer) clearInterval(typewriterTimer);
      fullCurrentText = text;
      isTypewriterActive = true;
      if (!activeDialogueTextEl) activeDialogueTextEl = dialogueTextSunita;

      activeDialogueTextEl.classList.remove('text-short', 'text-medium', 'text-long');
      if (text.length <= 60) {
        activeDialogueTextEl.classList.add('text-short');
      } else if (text.length <= 110) {
        activeDialogueTextEl.classList.add('text-medium');
      } else {
        activeDialogueTextEl.classList.add('text-long');
      }

      activeDialogueTextEl.textContent = "";
      let charIndex = 0;
      typewriterTimer = setInterval(() => {
        if (charIndex < text.length) {
          activeDialogueTextEl.textContent += text.charAt(charIndex);
          if (charIndex % 3 === 0) audio.playTypewriterClick();
          charIndex++;
        } else {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
          isTypewriterActive = false;
        }
      }, 16);
    }

    function completeTypewriterEarly() {
      if (typewriterTimer) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
      }
      if (activeDialogueTextEl) {
        activeDialogueTextEl.textContent = fullCurrentText;
      }
      isTypewriterActive = false;
    }

    /* ==========================================================================
       Render Current Scene
       ========================================================================== */
    function renderScene(index) {
      if (index >= scenes.length) {
        showMissionComplete();
        return;
      }

      const scene = scenes[index];

      // Update Background
      if (scene.bg) {
        bgLayer.style.backgroundImage = `url('${scene.bg}')`;
      }

      // Sunita Character Visibility & Pose
      if (scene.sunitaPose) {
        sunitaImg.src = scene.sunitaPose;
        charSunita.classList.remove('hidden');
      } else {
        charSunita.classList.add('hidden');
      }

      // Astronaut Visibility
      if (scene.astronaut) {
        charAstronaut.classList.remove('hidden');
      } else {
        charAstronaut.classList.add('hidden');
      }

      // Airlock Back-view Characters (Scenes 4 & 5 - image 129 & 130)
      if (scene.airlockCharacters) {
        airlockCharacters.classList.remove('hidden');
      } else {
        airlockCharacters.classList.add('hidden');
      }

      // Toxic Regolith Overlays (Scenes 6 & 7 - R.png & tOXIC_cOMPONENTS.webp)
      if (scene.toxicOverlays) {
        toxicSurfaceOverlays.classList.remove('hidden');
      } else {
        toxicSurfaceOverlays.classList.add('hidden');
      }

      // Regolith Card (Scene 2)
      if (scene.showCard) {
        regolithCard.classList.remove('hidden');
      } else {
        regolithCard.classList.add('hidden');
      }

      // Interactive START Button (Scene 10)
      if (scene.type === 'start_button') {
        startButtonContainer.classList.remove('hidden');
      } else {
        startButtonContainer.classList.add('hidden');
      }

      // HUD Badges
      if (scene.hudDays) {
        hudDaysText.textContent = scene.hudDays;
        hudDaysBadge.classList.remove('hidden');
      } else {
        hudDaysBadge.classList.add('hidden');
      }

      if (scene.hudEarth) {
        hudEarthCallout.classList.remove('hidden');
      } else {
        hudEarthCallout.classList.add('hidden');
      }

      // Hide Questions & Dialogues by default
      questionWrapper.classList.add('hidden');
      dialogueWrapper.classList.add('hidden');
      dialogueBoxSunita.classList.add('hidden');
      dialogueBoxAstroBee.classList.add('hidden');

      if (scene.type === 'question') {
        renderQuestion(scene.question);
      } else if (scene.type === 'start_button') {
        // Scene 10: Pure start button view - hide dialogue bar and skip button completely
        dialogueWrapper.classList.add('hidden');
        dialogueBoxSunita.classList.add('hidden');
        dialogueBoxAstroBee.classList.add('hidden');
      } else if (scene.type === 'visual') {
        // Scene 6 visual display - auto-fades up to next scene without waiting for click
        dialogueWrapper.classList.add('hidden');
        if (visualSceneTimer) clearTimeout(visualSceneTimer);
        visualSceneTimer = setTimeout(() => {
          advanceNextScene();
        }, 2600);
      } else {
        // Standard Dialogue Scene
        dialogueWrapper.classList.remove('hidden');
        if (scene.speaker === 'astrobee') {
          dialogueBoxAstroBee.classList.remove('hidden');
          activeDialogueTextEl = dialogueTextAstroBee;
        } else {
          dialogueBoxSunita.classList.remove('hidden');
          activeDialogueTextEl = dialogueTextSunita;
        }
        startTypewriter(scene.text);
      }
    }

    /* ==========================================================================
       Astro Bee Interactive Questions
       ========================================================================== */
    function renderQuestion(q) {
      questionLocked = false;
      questionPrompt.textContent = q.prompt;
      questionOptionsGroup.innerHTML = "";

      q.options.forEach((optText, optIdx) => {
        const letter = String.fromCharCode(65 + optIdx);
        const row = document.createElement('div');
        row.className = 'mcq-option-item';
        row.innerHTML = `
          <div class="mcq-checkbox" id="check_${optIdx}"></div>
          <span class="mcq-option-text">${letter}. ${optText}</span>
        `;
        row.onclick = () => handleOptionSelected(optIdx, q.correctIndex, row);
        questionOptionsGroup.appendChild(row);
      });

      questionWrapper.classList.remove('hidden');
    }

    function handleOptionSelected(selectedIndex, correctIndex, rowEl) {
      if (questionLocked) return;
      questionLocked = true;

      const checkbox = rowEl.querySelector('.mcq-checkbox');
      if (checkbox) checkbox.classList.add('checked');

      if (selectedIndex === correctIndex) {
        rowEl.classList.add('state-correct');
        audio.playCorrect();
        correctAnswersCount++;
        setTimeout(() => {
          proceedAfterQuestion();
        }, 1100);
      } else {
        rowEl.classList.add('state-wrong');
        audio.playWrong();
        // Highlight correct option
        setTimeout(() => {
          const correctRow = questionOptionsGroup.children[correctIndex];
          if (correctRow) {
            correctRow.classList.add('state-correct');
            const cbox = correctRow.querySelector('.mcq-checkbox');
            if (cbox) cbox.classList.add('checked');
          }
          setTimeout(() => {
            proceedAfterQuestion();
          }, 1400);
        }, 600);
      }
    }

    function proceedAfterQuestion() {
      questionWrapper.classList.add('hidden');
      const scene = scenes[currentSceneIndex];
      if (scene && scene.id === 13) {
        // Day 5 question completed -> Day 15 Timelapse
        runTimelapse(5, 15, () => {
          advanceNextScene(); // Lands on Scene 14 (Day 15)
        });
      } else if (scene && scene.id === 15) {
        // Day 15 question completed -> Day 23 Timelapse
        runTimelapse(15, 23, () => {
          advanceNextScene(); // Lands on Scene 16 (Day 23)
        });
      } else {
        advanceNextScene();
      }
    }

    /* ==========================================================================
       Scenes 10, 11, 14, 16: Animated Timelapse UI
       ========================================================================== */
    function runTimelapse(fromDay, toDay, callback) {
      timelapseOverlay.classList.add('active');
      audio.playDialogueAdvance();

      timelapseCounter.textContent = `DAY ${fromDay}`;
      timelapseFill.style.width = '0%';

      const totalSteps = 24;
      let step = 0;

      const timelapseInterval = setInterval(() => {
        step++;
        const pct = Math.min(100, Math.round((step / totalSteps) * 100));
        timelapseFill.style.width = `${pct}%`;

        const dayVal = Math.floor(fromDay + (step / totalSteps) * (toDay - fromDay));
        timelapseCounter.textContent = `DAY ${dayVal}`;
        audio.playTimelapseTick();

        if (step >= totalSteps) {
          clearInterval(timelapseInterval);
          timelapseCounter.textContent = `DAY ${toDay}`;
          setTimeout(() => {
            timelapseOverlay.classList.remove('active');
            if (callback) callback();
          }, 450);
        }
      }, 55);
    }

    function initiateTimelapse() {
      startButtonContainer.classList.add('hidden');
      runTimelapse(0, 5, () => {
        advanceNextScene(); // Lands on Scene 12 (Day 5)
      });
    }

    /* ==========================================================================
       Navigation & Flow Control
       ========================================================================== */
    function handleDialogueClick() {
      if (isTypewriterActive) {
        completeTypewriterEarly();
      } else {
        advanceNextScene();
      }
    }

    function handleActionBtnClick() {
      if (isTypewriterActive) {
        completeTypewriterEarly();
      } else {
        advanceNextScene();
      }
    }

    function advanceNextScene() {
      if (visualSceneTimer) {
        clearTimeout(visualSceneTimer);
        visualSceneTimer = null;
      }
      audio.playDialogueAdvance();
      currentSceneIndex++;
      renderScene(currentSceneIndex);
    }

    // Click anywhere on viewport for visual scene (Scene 6)
    document.getElementById('gameViewport').addEventListener('click', (e) => {
      if (currentSceneIndex === 5) { // Scene 6
        advanceNextScene();
      }
    });

    /* ==========================================================================
       Mission Complete
       ========================================================================== */
    function showMissionComplete() {
      audio.playFanfare();

      // Calculate score based on 4 questions
      const finalScorePct = Math.round((correctAnswersCount / totalQuestions) * 100);
      circleScoreNum.textContent = `${finalScorePct}%`;

      const circumference = 314.16;
      const offset = circumference - (circumference * finalScorePct) / 100;
      scoreCircleProgress.style.strokeDashoffset = offset;

      if (finalScorePct >= 80) {
        scoreCircleProgress.style.stroke = '#22c55e';
        circleScoreNum.style.color = '#22c55e';
        circleScoreNum.style.textShadow = '0 0 14px rgba(34, 197, 94, 0.85)';
      } else if (finalScorePct >= 40) {
        scoreCircleProgress.style.stroke = '#fdcb0e';
        circleScoreNum.style.color = '#fdcb0e';
        circleScoreNum.style.textShadow = '0 0 14px rgba(253, 203, 14, 0.85)';
      } else {
        scoreCircleProgress.style.stroke = '#ef4444';
        circleScoreNum.style.color = '#ef4444';
        circleScoreNum.style.textShadow = '0 0 14px rgba(239, 68, 68, 0.85)';
      }

      // Save unlock status in localStorage so mission 2.2 is permanently completed
      try {
        localStorage.setItem('moonfall_mission_2_2_completed', 'true');
        localStorage.setItem('moonfall_mission_2_2_score', finalScorePct);
      } catch (e) { }

      missionCompleteOverlay.classList.remove('hidden');

      // Astro Bee concluding dialogue at bottom dock
      dialogueWrapper.classList.remove('hidden');
      dialogueBoxSunita.classList.add('hidden');
      dialogueBoxAstroBee.classList.remove('hidden');
      activeDialogueTextEl = dialogueTextAstroBee;

      const completeMsg = "Outstanding observations, Cadet! Your lunar regolith research brings us one step closer to sustainable agriculture on the Moon!";
      startTypewriter(completeMsg);
    }

    function restartMission() {
      currentSceneIndex = 0;
      correctAnswersCount = 0;
      questionLocked = false;
      missionCompleteOverlay.classList.add('hidden');
      renderScene(0);
    }

    function returnToBase() {
      window.location.href = 'index.html';
    }

    function goToNextMission() {
      window.location.href = '5.1_Radiation_mission.html';
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        handleDialogueClick();
      }
    });

    // Start on DOMContentLoaded
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sceneParam = urlParams.get('scene');
      if (sceneParam !== null) {
        const parsed = parseInt(sceneParam, 10);
        if (!isNaN(parsed) && parsed >= 0 && parsed < scenes.length) {
          currentSceneIndex = parsed;
        }
      }
      renderScene(currentSceneIndex);
    });
