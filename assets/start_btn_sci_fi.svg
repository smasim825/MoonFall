<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="100%" height="100%">
  <defs>
    <!-- Platinum / White Cyber Top Rail -->
    <linearGradient id="topSilverMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Lower Gold Metallic Frame -->
    <linearGradient id="bottomGoldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Golden Accent Tabs -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Pristine White Core Plate -->
    <linearGradient id="whiteCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Drop Shadow Filter for Inner Plate Depth -->
    <filter id="plateBevel" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 1. Outer Dark Silhouette Base -->
  <path d="M 38 4 L 442 4 L 478 70 L 442 136 L 38 136 L 2 70 Z"
        fill="#020617" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />

  <!-- 2. Bottom & Side Golden Frame -->
  <path d="M 2 70 L 38 136 L 442 136 L 478 70 L 460 70 L 430 126 L 50 126 L 20 70 Z"
        fill="url(#bottomGoldMetallic)" />

  <!-- 3. Top White / Platinum Metallic Rail -->
  <path d="M 2 70 L 38 4 L 442 4 L 478 70 L 460 70 L 430 14 L 50 14 L 20 70 Z"
        fill="url(#topSilverMetallic)" />

  <!-- 4. Top Rail Cyber Tech Cuts & Notches -->
  <!-- Left Notch Cutout -->
  <path d="M 90 4 L 130 4 L 122 14 L 82 14 Z" fill="url(#bottomGoldMetallic)" />
  <path d="M 94 6 L 126 6 L 120 12 L 86 12 Z" fill="#0f172a" opacity="0.4" />
  <!-- Right Notch Cutout -->
  <path d="M 350 4 L 390 4 L 398 14 L 358 14 Z" fill="url(#bottomGoldMetallic)" />
  <path d="M 354 6 L 386 6 L 394 12 L 360 12 Z" fill="#0f172a" opacity="0.4" />

  <!-- 5. Bottom Cyber Gold Stepped Tabs -->
  <path d="M 46 126 L 96 126 L 90 136 L 38 136 Z" fill="url(#goldAccent)" />
  <path d="M 384 126 L 434 126 L 442 136 L 390 136 Z" fill="url(#goldAccent)" />

  <!-- 6. Left & Right Inner Chevrons / Brackets -->
  <path d="M 14 70 L 34 32 L 40 32 L 22 70 L 40 108 L 34 108 Z" fill="url(#goldAccent)" />
  <path d="M 466 70 L 446 32 L 440 32 L 458 70 L 440 108 L 446 108 Z" fill="url(#goldAccent)" />

  <!-- 7. Dark Gasket Rim Around Core Plate -->
  <path d="M 48 13 L 432 13 L 463 70 L 432 127 L 48 127 L 17 70 Z"
        fill="#0a0f1d" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />

  <!-- 8. Pristine White Core Plate -->
  <path d="M 50 15 L 430 15 L 460 70 L 430 125 L 50 125 L 20 70 Z"
        fill="url(#whiteCore)" filter="url(#plateBevel)" />

  <!-- 9. Inner Chamfer Gloss Border Highlight -->
  <path d="M 54 18 L 426 18 L 452 66 L 446 66 L 422 22 L 58 22 Z"
        fill="#ffffff" opacity="0.95" />

  <!-- 10. Sci-Fi START Wordmark (Solid Black) -->
  <g fill="#05070d" stroke="#05070d" stroke-width="0.6" stroke-linejoin="miter">
    <!-- S -->
    <path d="M 104 58 L 103 66 L 106 72 L 109 74 L 142 75 L 144 79 L 142 81 L 110 81 L 102 91 L 147 91 L 153 88 L 156 84 L 156 74 L 149 68 L 117 67 L 115 65 L 117 62 L 147 62 L 155 52 L 154 51 L 116 51 L 109 53 Z" />
    <!-- T1 -->
    <path d="M 207 51 L 163 51 L 155 62 L 172 62 L 173 91 L 185 92 L 186 63 L 200 62 L 208 52 Z" />
    <!-- A -->
    <path d="M 263 90 L 238 54 L 230 50 L 226 51 L 221 56 L 197 91 L 212 91 L 230 66 L 240 80 L 223 82 L 217 92 L 262 92 Z" />
    <!-- R -->
    <path d="M 268 61 L 306 62 L 309 65 L 309 68 L 305 71 L 268 71 L 269 92 L 279 92 L 280 83 L 282 81 L 299 81 L 309 92 L 324 91 L 313 79 L 320 74 L 323 66 L 321 59 L 316 54 L 307 51 L 276 51 Z" />
    <!-- T2 -->
    <path d="M 334 51 L 326 62 L 343 62 L 344 90 L 357 91 L 357 63 L 371 62 L 379 52 Z" />
  </g>
</svg>